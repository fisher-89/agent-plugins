ages,\n  runRecordToUIMessage,\n  type AgentUIMessage,\n} from '../lib/agent-adapter';\nimport { TauriAgentTransport } from '../lib/agent-transport';\nimport {\n  commands,\n  type AgentEvent,\n  type AgentPermissionMode,\n  type AgentRunRecord,\n  type EngineKind,\n} from '../types/generated/bindings';\n\n/** 会话来源参数（source 二元组 + cwd；sourceRef=null 即不重放装载） */\nexport interface UseAgentChatParams {\n  source: string;\n  sourceRef: string | null;\n  root: string | null;\n}\n\n/** 单次发送入参（文本已由来源侧组装完毕；engine 可选——仅调试页传入，\n * explore 链等正式场景不传、无选择 UI，缺席透传不注入缺省值，由后端\n * 默认 agent 生效） */\ninterface AgentChatSendInput {\n  prompt: string;\n  permissionMode: AgentPermissionMode;\n  engine?: EngineKind;\n}\n\n/** 会话基建状态面（镜像 + 行为；类型经本面结构化流转，视图层不 import ai） */\nexport interface UseAgentChatState {\n  messages: AgentUIMessage[];\n  events: AgentEvent[];\n  chain: AgentRunRecord[];\n  loading: boolean;\n  running: boolean;\n  error: string | null;\n  currentRunId: number | null;\n  sendMessage: (input: AgentChatSendInput) => void;\n  stop: () => void;\n  reset: () => void;\n}\n\n/** 链尾取最后一条非 running 记录（续话参数来源；running 过滤防御竞态） */\nfunction chainTail(chain: AgentRunRecord[]): AgentRunRecord | null {\n  for (let index = chain.length - 1; index >= 0; index -= 1) {\n    if (chain[index].status !== 'running') return chain[index];\n  }\n  return null;\n}\n\n/** 镜像扁平化：链序逐 run 拼接事件（实时与重放共用同一口径） */\nfunction flatEvents(chain: AgentRunRecord[], byRun: Map<"+"number, AgentEvent[]>): AgentEvent[] {\n  return chain.flatMap((run) => byRun.get(run.id) ?? []);\n}\n\n/** 重放/归一重建：逐 run 事件折叠 + 终态 record 部件交错（running 无 record） */\nfunction buildMessages(\n  chain: AgentRunRecord[],\n  byRun: Map<"+"number, AgentEvent[]>,\n): AgentUIMessage[] {\n  return chain.flatMap((run) => {\n    const replayed = eventsToUIMessages(byRun.get(run.id) ?? []);\n    return run.status === 'running' ? replayed : [...replayed, runRecordToUIMessage(run)];\n  });\n}\n\n/** 链还原 + 逐 run 事件重放（store 链查询收口单点，hook 不拼链；root 寻址\n * 所属 workspace 库——run id 与 explore 记录 id 均为库域内） */\nasync function loadChain(\n  root: string,\n  source: string,\n  sourceRef: string,\n): Promise<"+"{ runs: AgentRunRecord[]; byRun: Map<"+"number, AgentEvent[]> }> {\n  const runs = await commands.agentRunChain(root, source, sourceRef);\n  const replays = await Promise.all(\n    runs.map(async (run) => [run.id, await commands.agentRunEvents(root, run.id)] as const),\n  );\n  return { runs, byRun: new Map(replays) };\n}\n\n/** 镜像内部态（ref 真相 + state 渲染双轨，transport 回调与发送组装读 ref） */\ninterface SessionMirrors {\n  chain: AgentRunRecord[];\n  events: AgentEvent[];\n  currentRunId: number | null;\n  chainRef: React.RefObject<"+"AgentRunRecord[]>;\n  eventsByRunRef: React.RefObject<"+"Map<"+"number, AgentEvent[]>>;\n  currentRunIdRef: React.RefObject<"+"number | null>;\n  handleEvent: (event: AgentEvent) => void;\n  handleRecord: (record: AgentRunRecord) => void;\n  setChain: (runs: AgentRunRecord[]) => void;\n  setEvents: (events: AgentEvent[]) => void;\n  setCurrentRunId: (runId: number | null) => void;\n  clear: () => void;\n}\n\n/** 链写入回调装配（upsert / 终态替换 / 清空）：纯回调，不持有状态 */\nfunction chainWrites(\n  chainRef: React.RefObject<"+"AgentRunRecord[]>,\n  eventsByRunRef: React.RefObject<"+"Map<"+"number, AgentEvent[]>>,\n  currentRunIdRef: React.RefObject<"+"number | null>,\n  setChain: (runs: AgentRunRecord[]) => void,\n  setEvents: (events: AgentEvent[]) => void,\n  setCurrentRunId: (runId: number | null) => void,\n): {\n  upsertRun: (record: AgentRunRecord) => void;\n  handleRecord: (record: AgentRunRecord) => void;\n  clear: () => void;\n} {\n  const upsertRun = (record: AgentRunRecord) => {\n    const next = [...chainRef.current];\n    const index = next.findIndex((run) => run.id === record.id);\n    if (index >= 0) next[index] = record;\n    else next.push(record);\n    chainRef.current = next;\n    setChain(next);\n  };\n  // transport 观测点：early-resolve running 记录 / 终态 record 按 id 替换\n  const handleRecord = (record: AgentRunRecord) => {\n    upsertRun(record);\n    if (record.status === 'running') {\n      currentRunIdRef.current = record.id;\n      setCurrentRunId(record.id);\n    }\n  };\n  const clear = () => {\n    chainRef.current = [];\n    eventsByRunRef.current = new Map();\n    currentRunIdRef.current = null;\n    setChain([]);\n    setEvents([]);\n    setCurrentRunId(null);\n  };\n  return { upsertRun, handleRecord, clear };\n}\n\n/** 镜像与 transport 观测回调：running 记录追加、终态按 id 替换、事件入桶 */\nfunction useSessionMirrors(): SessionMirrors {\n  const [chain, setChain] = useState<"+"AgentRunRecord[]>([]);\n  const [events, setEvents] = useState<"+"AgentEvent[]>([]);\n  const [currentRunId, setCurrentRunId] = useState<"+"number | null>(null);\n  const chainRef = useRef<"+"AgentRunRecord[]>([]);\n  const eventsByRunRef = useRef<"+"Map<"+"number, AgentEvent[]>>(new Map());\n  const currentRunIdRef = useRef<"+"number | null>(null);\n  const { handleRecord, clear } = chainWrites(\n    chainRef,\n    eventsByRunRef,\n    currentRunIdRef,\n    setChain,\n    setEvents,\n    setCurrentRunId,\n  );\n\n  // transport 观测点：实时事件入当前 run 桶并同步扁平镜像\n  const handleEvent = useCallback((event: AgentEvent) => {\n    const runId = currentRunIdRef.current;\n    if (runId === null) return;\n    const bucket = eventsByRunRef.current.get(runId) ?? [];\n    eventsByRunRef.current.set(runId, [...bucket, event]);\n    setEvents(flatEvents(chainRef.current, eventsByRunRef.current));\n  }, []);\n\n  return {\n    chain,\n    events,\n    currentRunId,\n    chainRef,\n    eventsByRunRef,\n    currentRunIdRef,\n    handleEvent,\n    handleRecord,\n    setChain,\n    setEvents,\n    setCurrentRunId,\n    clear,\n  };\n}\n\n/** 重放装载：source 二元组变更触发；镜像与消息状态按查询结果重建 */\nfunction useChainReplay(\n  params: UseAgentChatParams,\n  mirrorsRef: React.RefObject<"+"SessionMirrors>,\n  setMessages: (messages: AgentUIMessage[]) => void,\n): { loading: boolean; error: string | null } {\n  const { source, sourceRef, root } = params;\n  const [loading, setLoading] = useState(false);\n  const [replayError, setReplayError] = useState<"+"string | null>(null);\n\n  useEffect(() => {\n    // 镜像经 ref 读取：效果仅随 source 二元组触发（镜像对象每渲染重建，\n    // 直接入 deps 会造成逐渲染重放循环）\n    const mirrors = mirrorsRef.current;\n    if (root === null || sourceRef === null) {\n      mirrors.clear();\n      setLoading(false);\n      setReplayError(null);\n      setMessages([]);\n      return;\n    }\n    let cancelled = false;\n    setLoading(true);\n    setReplayError(null);\n    loadChain(root, source, sourceRef)\n      .then(({ runs, byRun }) => {\n        if (cancelled) return;\n        mirrors.chainRef.current = runs;\n        mirrors.eventsByRunRef.current = byRun;\n        const tail = chainTail(runs);\n        mirrors.currentRunIdRef.current = tail?.id ?? null;\n        mirrors.setChain(runs);\n        mirrors.setEvents(flatEvents(runs, byRun));\n        mirrors.setCurrentRunId(tail?.id ?? null);\n        setMessages(buildMessages(runs, byRun));\n        setLoading(false);\n      })\n      .catch((cause: unknown) => {\n        if (cancelled) return;\n        setReplayError(String(cause));\n        setLoading(false);\n      });\n    return () => {\n      cancelled = true;\n    };\n  }, [source, sourceRef, root, setMessages, mirrorsRef]);\n\n  return { loading, error: replayError };\n}\n\n/** 会话行为（发送组装 / 停止 / 重置）；链参数在此收口、body 穿透 transport */\nfunction useSessionActions(\n  chat: ReturnType<"+"typeof useChat<"+"AgentUIMessage>>,\n  mirrors: SessionMirrors,\n  params: UseAgentChatParams,\n  setMessages: (messages: AgentUIMessage[]) => void,\n): {\n  sendMessage: (input: AgentChatSendInput) => void;\n  stop: () => void;\n  reset: () => void;\n} {\n  const { source, sourceRef, root } = params;\n\n  const sendMessage = useCallback(\n    (input: AgentChatSendInput) => {\n      if (root === null) return;\n      // 运行中重复发送忽略（status 直读 chat 实例，同步无竞态）\n      if (chat.status === 'submitted' || chat.status === 'streaming') return;\n      const tail = chainTail(mirrors.chainRef.current);\n      void chat.sendMessage(undefined, {\n        body: {\n          root,\n          prompt: input.prompt,\n          permissionMode: input.permissionMode,\n          engine: input.engine ?? null,\n          resumeSessionId: tail?.sessionId ?? null,\n          parentRunId: tail?.id ?? null,\n          source,\n          sourceRef,\n        },\n      });\n    },\n    [chat, mirrors.chainRef, root, source, sourceRef],\n  );\n\n  const stop = useCallback(() => {\n    const runId = mirrors.currentRunIdRef.current;\n    // 不调 chat.stop() 截断前端流：终态 record 部件与 finish 由后端闭流推入；\n    // 停止寻址携 root（run id 为 workspace 库域内自增，复合键消解跨库歧义）\n    if (runId !== null && root !== null) void commands.agentStop(root, runId);\n  }, [mirrors.currentRunIdRef, root]);\n\n  const reset = useCallback(() => {\n    mirrors.clear();\n    setMessages([]);\n  }, [mirrors, setMessages]);\n\n  return { sendMessage, stop, reset };\n}\n\n/**\n * 会话基建 hook（explore 会话 / agent 调试 / 未来 agent 会话页面统一消费）。\n * 入参变更（source 二元组）触发重放装载；发送 / 停止 / 重置见模块文档。\n */\nexport function useAgentChat(params: UseAgentChatParams): UseAgentChatState {\n  const mirrors = useSessionMirrors();\n\n  const transport = useMemo(\n    () => new TauriAgentTransport({ onEvent: mirrors.handleEvent, onRecord: mirrors.handleRecord }),\n    [mirrors.handleEvent, mirrors.handleRecord],\n  );\n\n  // 收口归一经 ref 延接 setMessages（onFinish 闭包在 useChat 初始化前构造）\n  const setMessagesRef = useRef<"+"(next: AgentUIMessage[]) => void>(() => {});\n  const chat = useChat<"+"AgentUIMessage>({\n    transport,\n    onFinish: () => {\n      // 流结束（含失败）按镜像重建，实时路与重放路同形状\n      setMessagesRef.current(\n        buildMessages(mirrors.chainRef.current, mirrors.eventsByRunRef.current),\n      );\n    },\n  });\n  const { messages, status, error, setMessages } = chat;\n  setMessagesRef.current = setMessages;\n\n  // 镜像经 ref 供效果读取（对象每渲染重建，不能进效果依赖）\n  const mirrorsRef = useRef(mirrors);\n  mirrorsRef.current = mirrors;\n\n  const replay = useChainReplay(params, mirrorsRef, setMessages);\n  const actions = useSessionActions(chat, mirrorsRef.current, params, setMessages);\n\n  return {\n    messages,\n    events: mirrors.events,\n    chain: mirrors.chain,\n    loading: replay.loading,\n    running: status === 'submitted' || status === 'streaming',\n    error: replay.error ?? (error !== undefined ? error.message : null),\n    currentRunId: mirrors.currentRunId,\n    ...actions,\n  };\n}\n"},"src/lib/agent-transport.ts":{"language":"typescript","mutants":[{"id":"192","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":58,"line":64},"start":{"column":19,"line":64}}},{"id":"202","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":58,"line":70},"start":{"column":19,"line":70}}},{"id":"247","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":6,"line":119},"start":{"column":47,"line":117}}},{"id":"248","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":66,"line":118},"start":{"column":23,"line":118}}},{"id":"148","mutatorName":"BlockStatement","replacement":"{}","statusReason":"expected { onEvent: ChannelMock{ …(1) }, …(8) } to match object { root: 'C:\\demo\\alpha', …(6) }\n(3 matching properties omitted from actual)","status":"Killed","static":false,"testsCompleted":2,"killedBy":["72"],"coveredBy":["59","60","62","63","64","65","66","67","68","69","71","72","73","74","75","76","77","79","80","81","82","83","84","85","86","88","92","93","94","95","96","97","98","99","114","115","116","117","118","119","120","122","123","124","125","126","127","128","130","131","132","133"],"location":{"end":{"column":2,"line":51},"start":{"column":86,"line":46}}},{"id":"150","mutatorName":"ConditionalExp eString(value: unknown, field: string): string | null {\n  if (typeof value === 'string' || value === null) return value;\n  throw new Error(`非法 ${field}: ${JSON.stringify(value)}`);\n}\n\n/** unknown → number | null（其余形态拒绝） */\nfunction readNullableNumber(value: unknown, field: string): number | null {\n  if (typeof value === 'number' || value === null) return value;\n  throw new Error(`非法 ${field}: ${JSON.stringify(value)}`);\n}\n\n/** body 逐字段读取（运行时校验，transport 不增删改写链参数） */\nfunction readChainParams(body: object | undefined): AgentStartChainParams {\n  const get = (key: string): unknown =>\n    Object.entries(body ?? {}).find(([name]) => name === key)?.[1];\n  const root = get('root');\n  const prompt = get('prompt');\n  const source = get('source');\n  if (typeof root !== 'string' || typeof prompt !== 'string' || typeof source !== 'string') {\n    throw new Error('缺少 agent_start 链参数（root / prompt / source）');\n  }\n  return {\n    root,\n    prompt,\n    source,\n    permissionMode: readPermissionMode(get('permissionMode')),\n    resumeSessionId: readNullableString(get('resumeSessionId'), 'resumeSessionId'),\n    parentRunId: readNullableNumber(get('parentRunId'), 'parentRunId'),\n    sourceRef: readNullableString(get('sourceRef'), 'sourceRef'),\n    engine: readEngine(get('engine')),\n  };\n}\n\n/**\n * Tauri `ChatTransport` 实现。发起新消息经 `agent_start` 提前 resolve\n * running 记录（经 `onRecord` 透传），事件与终态记录经 Channel 流入翻译为\n * chunk 流；Record 信封收尾（record 部件 + finish + 关流）。\n */\nexport class TauriAgentTransport implements ChatTransport<"+"AgentUIMessage> {\n  private readonly onEvent?: (event: AgentEvent) => void;\n  private readonly onRecord?: (record: AgentRunRecord) => void;\n\n  constructor(options?: TauriAgentTransportOptions) {\n    this.onEvent = options?.onEvent;\n    this.onRecord = options?.onRecord;\n  }\n\n  async sendMessages(options: {\n    trigger: 'submit-message' | 'regenerate-message';\n    chatId: string;\n    messageId: string | undefined;\n    message mport { Button } from '@/components/ui/button';\n\nimport { AgentTimeline } from '../../components/agent';\nimport { useAgentChat } from '../../hooks/use-agent-chat';\nimport { AgentRawStream } from './components/agent-raw-stream';\nimport { AgentRunForm, type AgentStartInput } from './components/agent-run-form';\nimport { AgentRunHistory } from './components/agent-run-history';\nimport { useAgentRunHistory } from './hooks/use-agent-run-history';\n\nexport interface AgentDebugViewProps {\n  /** 当前 workspace root（cwd 隐含来源）；null 即未选定 workspace */\n  root: string | null;\n}\n\n/** 视图切换行（页面级 chrome）：时间线 / 原始 JSONL 切换 + 运行中停止入口 */\nfunction StreamToggle({\n  showRaw,\n  onToggle,\n  running,\n  onStop,\n}: {\n  showRaw: boolean;\n  onToggle: (showRaw: boolean) => void;\n  running: boolean;\n  onStop: () => void;\n}): React.JSX.Element {\n  return (\n    <"+"div className=\"mb-3 flex items-center gap-2\" data-testid=\"stream-toggle\">\n      <"+"span className=\"text-xs text-muted-foreground\">实时流视图<"+"/span>\n      <"+"Button\n        aria-pressed={!showRaw}\n        className={showRaw ? 'bg-muted text-muted-foreground' : undefined}\n        data-testid=\"toggle-timeline\"\n        onClick={() => onToggle(false)}\n      >\n        时间线\n      <"+"/Button>\n      <"+"Button\n        aria-pressed={showRaw}\n        className={showRaw ? undefined : 'bg-muted text-muted-foreground'}\n        data-testid=\"toggle-raw\"\n        onClick={() => onToggle(true)}\n      >\n        原始 JSONL\n      <"+"/Button>\n      {running && (\n        <"+"Button className=\"ml-auto\" data-testid=\"run-stop\" onClick={onStop}>\n          停止运行\n        <"+"/Button>\n      )}\n    <"+"/div>\n  );\n}\n\n/** 错误横幅：启动阶段失败（CLI 缺失 / spawn 失败 / store 失败）直出 */\nfunction RunErrorBanner({ error }: { error: string }): React.JSX.Element {\n  return (\n    <"+"div\n      className=\"mb-4 break-all rounded-md bg-fail-bg px-3 py-2 text-fail\"\n      data-testid=\"run-error\"\n    >\n      运行发起失败：{error}\n    <"+"/div>\n  );\n}\n\n/**\n * Agent 调试页：参数面 + 实时时间线（原始 JSONL 切换）+ 运行中停止入口 +\n * 历史运行区。页面状态经统一会话基建 use-agent-chat 承载（source=\"debug\"、\n * sourceRef=null 不重放装载，每次发起先 reset 防串场）；start 全量透传\n * AgentStartInput——含 engine 引擎选择（sdk 初始、与后端默认一致 / cli\n * 显式可选项；引擎选择仅调试页暴露，正式场景无入口，sdk 配置未手填时\n * 启动以错误横幅显式失败）；时间线经 AgentTimeline\n * 保真透镜、原始流消费 chat 的 events 镜像；run 表单 / 历史列表 / JSONL 开关\n * 为页面级 chrome，包在共享核心外圈。布局接入壳层 flex 链：根 flex-1，流视图\n * 区（时间线 / 原始 JSONL 二选一）填充剩余区域并内部滚动，表单 / 横幅 / 切换\n * 行 / 历史区自然高。历史列表与重放经 useAgentRunHistory 的\n * 显式 invoke 查询；实时流属执行流通道（agent_start 命令作用域），不属\n * 「刷新取数模型」禁止的轮询取数。无路由（页面切换由 App 层顶层 state 承担）。\n */\nexport function AgentDebugView({ root }: AgentDebugViewProps): React.JSX.Element {\n  const history = useAgentRunHistory(root);\n  const [showRaw, setShowRaw] = useState(false);\n  const session = useAgentChat({ source: 'debug', sourceRef: null, root });\n\n  // 每跑重置：上一跑 messages / events / chain 清空，不串场\n  const start = (input: AgentStartInput) => {\n    session.reset();\n    session.sendMessage(input);\n  };\n\n  if (root === null) {\n    return (\n      <"+"div className=\"text-muted-foreground\" data-testid=\"agent-no-root\">\n        请先在侧栏选择一个 workspace。\n      <"+"/div>\n    );\n  }\n\n  return (\n    <"+"div className=\"flex min-h-0 flex-1 flex-col\">\n      <"+"AgentRunForm disabled={session.running} onStart={start} />\n      {session.error !== null && <"+"RunErrorBanner error={session.error} />}\n      <"+"StreamToggle\n        showRaw={showRaw}\n        onToggle={setShowRaw}\n        running={session.running}\n        onStop={session.stop}\n      />\n      {showRaw ? (\n        <"+"AgentRawStream events={session.events} />\n      ) : (\n        <"+"AgentTimeline messages={session.messages} running={session.running} />\n      )}\n      <"+"AgentRunHistory state={history} />\n    <"+"/div>\n  );\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"src/app.test.tsx":{"tests":[{"id":"0","name":"App：启动恢复、欢迎屏清单与视图  分支静默保持现状语义）"},{"id":"16","name":"App：错误双轨呈现——动作 reject → toast / 查询 reject → inline（AC-8） remove resolve(false)（store miss 幂等）：无 toast、无 error-note（D8 排除项在壳层的核对）"},{"id":"17","name":"App：错误双轨呈现——动作 reject → toast / 查询 reject → inline（AC-8） 全部动作与查询成功：无 toast、无 error-note（零呈现基线）"},{"id":"18","name":"App：错误双轨呈现——动作 reject → toast / 查询 reject → inline（AC-8） list_workspaces reject：欢迎屏 error-note 持久渲染不消失（「workspace 清单加载失败」前缀语义）——查询轨 inline 不入双轨"},{"id":"19","name":"App：错误双轨呈现——动作 reject → toast / 查询 reject → inline（AC-8） updater error：「重试更新」按钮在场且点击语义不变（不经 toast，UpdateIndicator 逐字不动）"},{"id":"20","name":"App：错误双轨呈现——动作 reject → toast / 查询 reject → inline（AC-8） 更新下载进度呈「下载中 42%」精确文案，Finished 转「正在安装…」终态并退出下载态"},{"id":"21","name":"App：错误双轨呈现——动作 reject → toast / 查询 reject → inline（AC-8） 版本号拉取失败：currentVersion=null 时顶栏不呈版本号文本（v 前缀 span 不渲染）"},{"id":"22","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） 壳态渲染 SidebarProvider / AppSidebar / SidebarInset 的 DOM 标记，宽度撑满inset容器"},{"id":"23","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） 页面无 combobox：queryByRole(\"combobox\") 为 null（AC-1 硬断言；取代原「下拉保持可操作」废弃用例）"},{"id":"24","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） header 终态：折叠钮（SidebarTrigger）+ 标题「Desktop Terminal」+ 版本/更新指示在场；无「刷新列表」「移除」按钮"},{"id":"25","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） root=null（空清单启动）：无 SidebarProvider / AppSidebar DOM，WelcomeView 全屏文案在场"},{"id":"26","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） Toaster 与条件渲染同级置于 App 根：欢迎态与壳态各验一次 sonner 容器在场"},{"id":"27","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） collapsible=\"icon\"：触发折叠后 sidebar 容器呈 icon 折叠标记（data-collapsible / data-state），清单项 Tooltip 在折叠态可显（D4-②）"},{"id":"28","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） Ctrl/Cmd+B：对 window 派发 keyDown（ctrlKey 与 metaKey 两形态）在 collapsed/expanded 间切换（D1 会话内 state）"},{"id":"29","name":"App：壳层布局与折叠形态（AC-1/AC-2/AC-7） 折叠态不持久化（D1）：卸载重挂回到展开态，无 localStorage / cookie 读写"},{"id":"30","name":"App：路由化顶层页面切换（changes | agent | db） 启动（hash 空）经 / 重定向落 #/changes：清单内容在场、Agent 调试页不在场、nav-changes 激活"},{"id":"31","name":"App：路由化顶层页面切换（changes | agent | db） 侧栏点击「Agent 调试」→ hash 落 #/agent、AgentDebugView 呈现、ChangeView 内容卸载；点击「变更」→ hash 回 #/changes 切回清单"},{"id":"32","name":"App：路由化顶层页面切换（changes | agent | db） 侧栏点击「数据库」→ DbInspectorView 呈现且 db_models 取数发起、其余两分支不挂载（db 分支渲染）"},{"id":"33","name":"App：路由化顶层页面切换（changes | agent | db） 切至 db 页再切回 changes：list_changes / list_workspaces 调用次数不增长（切页不触发取数）"},{"id":"34","name":"App：路由化顶层页面切换（changes | agent | db） 侧栏点击「Agent 调试」→ agent_runs 挂载取数携当前 workspace root（返回 [] 数组形态不变）"},{"id":"35","name":"App：路由化顶层页面切换（changes | agent | db） 进入 change 详情后切 Agent 页再切回：hash 落 /changes（无 :name 段）、选中重置回清单、get_change_detail 不以旧选中重发（D10 路由化保留）"},{"id":"36","name":"App：路由化顶层页面切换（changes | agent | db） useChangeList 留在 App 层不随路由切换卸载：切页往返不重发 list_workspaces（清单数据不丢）"},{"id":"37","name":"App：路由化顶层页面切换（changes | agent | db） 导航点击不触发任何 workspace 命令（两入口语义不串扰）"},{"id":"38","name":"App：路由化顶层页面切换（changes | agent | db） root=null（无 workspace）时欢迎屏持有、页面导航不在场（含 nav-db）、不崩"},{"id":"39","name":"App：壳层滚动框架 壳态路由内容包裹层增 flex min-h-0 flex-col 类（高度链起点），既有留白类不回归"},{"id":"40","name":"App：壳层滚动框架 切页往返（changes → db → changes）包裹层框架类稳定，清单 / 数据库页呈现不回归"},{"id":"41","name":"App：HashRouter 自含挂载与路由初态（D2/D6/D7） 壳态启动不包任何 Router 包裹：hash 落 #/changes、清单渲染、sidebar-wrapper / header 在场（D2 自含 HashRouter）"},{"id":"42","name":"App：HashRouter 自含挂载与路由初态（D2/D6/D7） 启动前 hash 已为 #/changes/add-feature：直出详情视图并以 URL 参数取数（深链直达 D7，无导航点击）"},{"id":"43","name":"App：HashRouter 自含挂载与路由初态（D2/D6/D7） 启动前 hash 已为 #/agent：直出 AgentDebugView（agent-run-form 在场）且 nav-agent 呈激活态"},{"id":"44","name":"App：HashRouter 自含挂载与路由初态（D2/D6/D7） 启动前 hash 为未知路径（#/bogus）：兜底落 #/changes 渲染清单，不空白不崩"},{"id":"45","name":"App：/info 基础信息路由可达与欢迎态隔离（AC-1） 壳态点击 nav-info：hash 落 #/info、基础信息页呈现（info-summary 在场）、变更页内容卸载、nav-info 激活"},{"id":"46","name":"App：/info 基础信息路由可达与欢迎态隔离（AC-1） 启动前 hash 已为 #/info：深链直出基础信息页且 nav-info 激活（对齐既有深链用例形态）"},{"id":"47","name":"App：/info 基础信息路由可达与欢迎态隔离（AC-1） 未知路径兜底回归：#/bogus 仍兜底落 #/changes（/info 插入不破 * 兜底语义）、不误触 code_stats"},{"id":"48","name":"App：/info 基础信息路由可达与欢迎态隔离（AC-1） #/info/xyz（路由表无 /info 子段）：兜底落 #/changes，不空白不崩"},{"id":"49","name":"App：/info 基础信息路由可达与欢迎态隔离（AC-1） 欢迎态（root=null）：无壳无 nav-info，#/info 不渲染基础信息页、仅欢迎屏（无 Router 挂壳的隔离）"},{"id":"50","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） 壳态点击 nav-config：hash 落 #/config、config-view 在场、nav-config 激活、变更页内容卸载、workspace_config 以 { root: 当前根 } 发起"},{"id":"51","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） 启动前 hash 已为 #/config：深链直出配置页且 nav-config 激活，恰发起一次解析（对齐 /info 深链用例形态）"},{"id":"52","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） 未知路径兜底回归：#/bogus 仍兜底落 #/changes（/config 插入不破 * 兜底语义）、不误触 workspace_config"},{"id":"53","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） #/config/xyz（路由表无子段）：兜底落 #/changes、不空白不崩"},{"id":"54","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） 欢迎态（root=null）：无壳无 nav-config，#/config 不渲染配置页仅欢迎屏、解析零发起（AC-4 后半）"},{"id":"55","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） workspace_config reject（含无效 root Err reject）：config-error inline 呈现、无 toast 顶替、壳不崩（AC-7 全链核对）"},{"id":"56","name":"App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7） 切换 workspace（sidebar 清单项）后停留 /config：以新根重发 workspace_config、旧根配置不呈现（AC-6 切换重取的壳层核对）"}],"source":"import { act, cleanup, fireEvent, render, screen, waitFor, within } from '@testing-library/react';\nimport { toast } from 'sonner';\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vite-plus/test';\n\nimport App from './app';\nimport type {\n  ChangeDetail,\n  ChangeList,\n  ModelInfo,\n  RecordEnvelope,\n  WorkspaceRecord,\n} from './types/dto';\nimport type { CodeStatsReport, WorkspaceConfigReport } from './types/generated/bindings';\n\nconst { checkMock, getVersionMock, invokeMock, openMock } = vi.hoisted(() => ({\n  checkMock: vi.fn(),\n  getVersionMock: vi.fn(),\n  invokeMock: vi.fn(),\n  openMock: vi.fn(),\n}));\n\nvi.mock('@tauri-apps/api/app', () => ({ getVersion: getVersionMock }));\nvi.mock('@tauri-apps/api/core', () => ({ invoke: invokeMock }));\nvi.mock('@tauri-apps/plugin-dialog', () => ({ open: openMock }));\n// updater mock（沿用 use-updater.test.ts 语义）：仅「重试更新」用例经 vi.stubEnv('DEV', false)\n// 启用检查路径；其余用例 DEV=true 跳过启动检查\nvi.mock('@tauri-apps/plugin-updater', () => ({ check: checkMock }));\n\n// ---------------------------------------------------------------------------\n// fixture：workspace 清单为默认序（canonical root 升序），FIRST 即默认序第一名\n// ---------------------------------------------------------------------------\n\nconst FIRST: WorkspaceRecord = {\n  root: 'C:\\\\demo\\\\alpha',\n  name: 'alpha',\n  addedAt: 1,\n};\nconst SECOND: WorkspaceRecord = {\n  root: 'C:\\\\demo\\\\beta',\n  name: 'beta',\n  addedAt: 1,\n};\n\nconst fakeList: ChangeList = {\n  active: [\n    { name: 'add-feature', source: 'active', inventory: 'v2', created: null, unparsable: false },\n  ],\n  archiveGroups: [],\n};\n\nconst fakeDetail: ChangeDetail = {\n  name: 'add-feature',\n  source: 'active',\n  inventory: 'v2',\n  created: null,\n  unparsable: false,\n  pipeline: [],\n  activePhase: null,\n  interrupted: [],\n  fileLog: [],\n  artifacts: [],\n};\n\n// db 查看域 fixture：DbInspectorView 挂载即 invoke(\"db_models\")，mock 必须回\n// 数组形态（null 会使 hook state.models 置 null 而崩），信封按 offset/limit 切页\nconst DB_MODELS: ModelInfo[] = [\n  { name: 'workspace', count: 2 },\n  { name: 'agent_run', count: 1 },\n  { name: 'agent_event', count: 0 },\n];\nconst DB_RECORDS: RecordEnvelope[] = [\n  { key: 'C:\\\\demo\\\\alpha', value: { root: 'C:\\\\demo\\\\alpha', name: 'alpha', addedAt: 1 } },\n  { key: 1, value: { id: 1, prompt: '你好', status: 'completed' } },\n  { key: { runId: 1, seq: 0 }, value: { eventKey: '0x1', runId: 1, event: { seq: 0 } } },\n];\n\n// 基础信息域 fixture：InfoView 挂载即以 (root, depth=5) invoke(\"code_stats\")，\n// 三面 DTO（totals.files > 0 → 非空态），树面顶层节点默认展开在 DOM\nconst CODE_STATS: CodeStatsReport = {\n  totals: { files: 12, code: 340, comments: 40, blanks: 20 },\n  languages: [\n    { name: 'Rust', files: 6, code: 220, comments: 30, blanks: 10, share: 64.7 },\n    { name: 'TypeScript', files: 6, code: 120, comments: 10, blanks: 10, share: 35.3 },\n  ],\n  tree: [\n    {\n      kind: 'dir',\n      node: {\n        name: 'src',\n        path: 'src',\n        files: 9,\n        code: 300,\n        comments: 35,\n        blanks: 18,\n        children: [],\n      },\n    },\n  ],\n};\n\n// 配置域 fixture：ConfigView 挂载即 invoke(\"workspace_config\")，camelCase 信封\n// （config + diagnostics）；context 归属 root 由 configReportFor 注入（切换\n// 用例区分新旧根数据）\nconst WORKSPACE_CONFIG: WorkspaceConfigReport = {\n  config: {\n    $schema: null,\n    schema: 'spec-driven',\n    context: null,\n    rules: { proposal: ['提案规则'], tasks: null },\n    staticAnalysis: 'clippy',\n    tests: [\n      {\n        root: 'packages/desktop',\n        framework: 'vite-plus',\n        cwd: 'packages/desktop',\n        config: null,\n        includes: null,\n        excludes: null,\n        coverage: { lines: 80, branches: 70, functions: 75 },\n        mutation: { cwd: null, score: 70 },\n      },\n    ],\n    writeProtection: null,\n    extra: [],\n  },\n  diagnostics: [\n    {\n      kind: 'defaultApplied',\n      path: 'tests[0].coverage.lines',\n      message: '覆盖率阈值 lines 未设置，使用默认值 80。',\n    },\n  ],\n};\n\n/** 配置报告 fixture 深拷贝（防用例间引用残留），context 承载归属 root。 */\nfunction configReportFor(root: string): WorkspaceConfigReport {\n  const report = JSON.parse(JSON.stringify(WORKSPACE_CONFIG)) as WorkspaceConfigReport;\n  report.config.context = root;\n  return report;\n}\n\n// ---------------------------------------------------------------------------\n// 进程边界 Mock：IPC 按命令名分发；文件夹对话框按用例 resolve / reject / cancel；\n// 版本号固定 resolve。sonner <"+"Toaster /> 不 mock：App 根真实挂载，toast 断言走\n// DOM 文案 + waitFor。sonner toast 状态为模块级单例、跨用例存活，beforeEach\n// 统一 dismiss 防残留。\n// ---------------------------------------------------------------------------\n\nlet remaining: WorkspaceRecord[];\nlet addBehavior: 'ok' | 'reject' = 'ok';\nlet addRecord: WorkspaceRecord | null = null;\nlet removeReject: string | null = null;\nlet removeMiss = false;\nlet listReject: string | null = null;\nlet configReject: string | null = null;\nlet configPending = false;\n\nfunction mockIpc() {\n  remaining = [FIRST, SECOND];\n  addBehavior = 'ok';\n  addRecord = null;\n  removeReject = null;\n  removeMiss = false;\n  listReject = null;\n  configReject = null;\n  configPending = false;\n  invokeMock.mockImplementation(\n    (\n      command: string,\n      params?: { root?: string; change?: string; offset?: number; limit?: number },\n    ) => {\n      if (command === 'list_workspaces') {\n        if (listReject !== null) return Promise.reject(new Error(listReject));\n        return Promise.resolve([...remaining]);\n      }\n      if (command === 'remove_workspace') {\n        if (removeReject !== null) return Promise.reject(new Error(removeReject));\n        if (removeMiss) return Promise.resolve(false); // store miss 幂等（D8 排除项）\n        remaining = remaining.filter((r) => r.root !== params?.root);\n        return Promise.resolve(true);\n      }\n      if (command === 'add_workspace') {\n        if (addBehavior === 'reject') {\n          return Promise.reject(new Error('canonicalize: 入库失败'));\n        }\n        const rec: WorkspaceRecord = addRecord ?? {\n          root: params?.root ?? '',\n          name: 'picked',\n          addedAt: 1,\n        };\n        // 对齐后端：库存按默认序（canonical root 升序）返回，新记录未必居首\n        remaining = [...remaining.filter((r) => r.root !== rec.root), rec].sort((a, b) =>\n          a.root <"+" b.root ? -1 : a.root > b.root ? 1 : 0,\n        );\n        return Promise.resolve(rec);\n      }\n      if (command === 'list_changes') {\n        return Promise.resolve(fakeList);\n      }\n      if (command === 'get_change_detail') {\n        return Promise.resolve(fakeDetail);\n      }\n      if (command === 'db_models') {\n        return Promise.resolve(DB_MODELS.map((model) => ({ ...model })));\n      }\n      if (command === 'db_records') {\n        const offset = params?.offset ?? 0;\n        const limit = params?.limit ?? 50;\n        return Promise.resolve(DB_RECORDS.slice(offset, offset + limit).map((e) => ({ ...e })));\n      }\n      // agent 调试页挂载取数（useAgentRunHistory 挂载发起 agent_runs）：回数组形态\n      // （null 会使 useRuns state.runs 置 null 而崩），页面切页往返断言不涉及其内容\n      if (command === 'agent_runs' || command === 'agent_run_events') {\n        return Promise.resolve([]);\n      }\n      // 基础信息页挂载取数（useCodeStats 挂载发起 code_stats）：回三面 DTO，\n      // fixture 深拷贝防用例间引用残留\n      if (command === 'code_stats') {\n        return Promise.resolve(JSON.parse(JSON.stringify(CODE_STATS)) as CodeStatsReport);\n      }\n      // 配置页挂载取数（useWorkspaceConfig 挂载发起 workspace_config）：\n      // resolve（context 归属 root）/ reject / 手动 pending 三态控制\n      if (command === 'workspace_config') {\n        if (configReject !== null) return Promise.reject(new Error(configReject));\n        if (configPending) return new Promise<"+"WorkspaceConfigReport>(() => {});\n        return Promise.resolve(configReportFor(params?.root ?? ''));\n      }\n      return Promise.resolve(null);\n    },\n  );\n}\n\n// ---------------------------------------------------------------------------\n// 装置\n// ---------------------------------------------------------------------------\n\n/** mock.calls 中某命令的调用次数。 */\nfunction countOf(command: string): number {\n  return invokeMock.mock.calls.filter(([name]) => name === command).length;\n}\n\n/** 以 data-root 定位 sidebar 清单项（同名项由 data-root 区分）。 */\nfunction itemByRoot(root: string): HTMLElement {\n  const hit = screen\n    .getAllByTestId('workspace-item')\n    .find((item) => item.getAttribute('data-root') === root);\n  if (!hit) throw new Error(`data-root 为 ${root} 的 workspace-item 不存在`);\n  return hit;\n}\n\n/** 有记录启动：等待自动恢复第一名进入列表视图（列表已渲染）。 */\nasync function restored() {\n  render(<"+"App />);\n  await waitFor(() =>\n    expect(invokeMock).toHaveBeenCalledWith('list_changes', { root: FIRST.root }),\n  );\n  await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n}\n\nfunction fakeUpdate(version = '0.2.0') {\n  return {\n    version,\n    body: '修复若干问题',\n    close: vi.fn().mockResolvedValue(undefined),\n    downloadAndInstall: vi.fn().mockResolvedValue(undefined),\n  };\n}\n\ndescribe('App：启动恢复、欢迎屏清单与视图状态（AC-9）', () => {\n  beforeEach(() => {\n    // 路由化后 App 自含 HashRouter（design D6）：jsdom location 跨用例存活，\n    // 上一用例残留的 hash 会改变下一用例启动路由初态，先重置\n    window.location.hash = '';\n    getVersionMock.mockReset();\n    invokeMock.mockReset();\n    openMock.mockReset();\n    checkMock.mockReset();\n    checkMock.mockResolvedValue(null);\n    // useUpdater 挂载拉取版本号：走独立 mock，不混入 invoke 调用序列断言\n    getVersionMock.mockResolvedValue('0.1.0');\n    toast.dismiss(); // sonner 模块级 toast 状态跨用例存活：清残留\n    mockIpc();\n  });\n\n  afterEach(() => {\n    vi.unstubAllEnvs();\n  });\n\n  it('list_workspaces 返回空清单启动：呈现欢迎屏空态与「添加新文件夹」入口，不进入列表视图', async () => {\n    remaining = [];\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('添加新文件夹') !== null).toBe(true));\n\n    expect(screen.getByText(/还没有记录/) !== null).toBe(true);\n    expect(screen.getByText(/选择一个项目根目录/) !== null).toBe(true);\n    // 欢迎屏清单标题与计数（D7：空清单计数为 0）\n    expect(screen.getByText(/最近的 workspace/).textContent).toContain('(0)');\n    expect(screen.queryByText('刷新列表')).toBeNull();\n    // 除挂载自动 load 外无任何取数\n    expect(invokeMock.mock.calls.every(([name]) => name === 'list_workspaces')).toBe(true);\n  });\n\n  it('欢迎屏加载中：挂载取数未返回时呈现「加载中…」，清单返回后消失', async () => {\n    let resolveLoad: (records: WorkspaceRecord[]) => void = () => {};\n    invokeMock.mockImplementation((command: string) => {\n      if (command === 'list_workspaces') {\n        return new Promise<"+"WorkspaceRecord[]>((resolve) => {\n          resolveLoad = resolve;\n        });\n      }\n      return Promise.resolve(null);\n    });\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('加载中…') !== null).toBe(true));\n    await act(async () => {\n      resolv > setTimeout(resolve, 10));\n    });\n    expect(invokeMock.mock.calls.length).toBe(callsBefore);\n    const lastListChanges = invokeMock.mock.calls\n      .filter(([name]) => name === 'list_changes')\n      .at(-1);\n    expect(lastListChanges).toEqual(['list_changes', { root: FIRST.root }]);\n    expect(screen.getByText('add-feature') !== null).toBe(true);\n  });\n\n  it('点击 GroupAction 内联图标：open({directory:true, multiple:false}) → add_workspace → 以返回记录打开 → list_changes 以返回记录的 canonical root 发起（改写：欢迎屏入口 → GroupAction 图标）', async () => {\n    await restored();\n    // 返回记录的 canonical root 与对话框原串书写不等价（模拟 canonicalize）\n    addRecord = { root: 'C:\\\\canonical\\\\picked', name: 'picked', addedAt: 1 };\n    openMock.mockResolvedValue('/raw/PICKED DIR');\n\n    fireEvent.click(screen.getByRole('button', { name: '添加 workspace' }));\n\n    // 对话框参数契约断言逐字保留：目录模式 + 单选\n    await waitFor(() =>\n      expect(openMock).toHaveBeenCalledWith({ directory: true, multiple: false }),\n    );\n    await waitFor(() =>\n      expect(invokeMock).toHaveBeenCalledWith('add_workspace', { root: '/raw/PICKED DIR' }),\n    );\n    await waitFor(() =>\n      expect(invokeMock).toHaveBeenCalledWith('list_changes', { root: 'C:\\\\canonical\\\\picked' }),\n    );\n    await waitFor(() => expect(screen.getByText('picked') !== null).toBe(true));\n    expect(itemByRoot('C:\\\\canonical\\\\picked').getAttribute('data-active')).toBe('true');\n  });\n\n  it('对话框取消（null）：不调用 add_workspace、停留当前态——两处入口（欢迎屏 / GroupAction）行为一致', async () => {\n    await restored();\n    openMock.mockResolvedValue(null);\n\n    // 入口一：壳态 GroupAction\n    fireEvent.click(screen.getByRole('button', { name: '添加 workspace' }));\n    await waitFor(() => expect(openMock).toHaveBeenCalled());\n    await act(async () => {\n      await new Promise((resolve) => setTimeout(resolve, 10));\n    });\n    expect(countOf('add_workspace')).toBe(0);\n    expect(screen.getAllByTestId('workspace-item')).toHaveLength(2);\n\n    // 入口二：欢迎屏「添加新文件 ('add-feature') !== null).toBe(true);\n  });\n\n  it('导航点击不触发任何 workspace 命令（两入口语义不串扰）', async () => {\n    await restored();\n\n    const addBefore = countOf('add_workspace');\n    const removeBefore = countOf('remove_workspace');\n    const listBefore = countOf('list_workspaces');\n    fireEvent.click(screen.getByTestId('nav-agent'));\n    fireEvent.click(screen.getByTestId('nav-changes'));\n\n    expect(countOf('add_workspace')).toBe(addBefore);\n    expect(countOf('remove_workspace')).toBe(removeBefore);\n    expect(countOf('list_workspaces')).toBe(listBefore);\n  });\n\n  it('root=null（无 workspace）时欢迎屏持有、页面导航不在场（含 nav-db）、不崩', async () => {\n    remaining = [];\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('添加新文件夹') !== null).toBe(true));\n\n    expect(screen.queryByTestId('nav-agent')).toBeNull();\n    expect(screen.queryByTestId('nav-changes')).toBeNull();\n    expect(screen.queryByTestId('nav-db')).toBeNull();\n    expect(screen.queryByText('系统工具')).toBeNull();\n    expect(screen.queryByTestId('db-model-list')).toBeNull();\n    expect(screen.getByText(/还没有记录/) !== null).toBe(true);\n    // 清单域取数形态不变：agent_runs / db_models 零调用，root 无从携带\n    expect(countOf('agent_runs')).toBe(0);\n    expect(countOf('db_models')).toBe(0);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 壳层滚动框架（回溯修订）：壳态路由内容包裹层增 flex min-h-0 flex-col 立高度\n// 链起点；其余路由页为内容自适应 flex item，呈现不变。jsdom 以 className 拓扑\n// 为代理断言（真实观感归人工验收）。\n// ---------------------------------------------------------------------------\n\ndescribe('App：壳层滚动框架', () => {\n  beforeEach(() => {\n    // 路由化后 App 自含 HashRouter（design D6）：jsdom location 跨用例存活，\n    // 上一用例残留的 hash 会改变下一用例启动路由初态，先重置\n    window.location.hash = '';\n    getVersionMock.mockReset();\n    invokeMock.mockReset();\n    openMock.mockReset();\n    checkMock.mockReset();\n    checkMock.mockResolvedValue(null);\n    getVersionMock.mockResolvedValue('0.1.0');\n    toast.dismiss();\n    mockIpc();\n  });\n\n  afterEach(() => {\n    vi.unstubAllEnvs();\n  });\n\n  /** 壳态路由内容包裹层（SidebarInset 下的 w-full 容器）。 */\n  function shellContentWrapper(): Element {\n    const inset = document.querySelector('main[data-slot=\"sidebar-inset\"]');\n    const wrapper = Array.from(inset?.children ?? []).find(\n      (el) => el.tagName === 'DIV' && el.className.includes('w-full'),\n    );\n    if (!wrapper) throw new Error('壳态路由内容包裹层不存在');\n    return wrapper;\n  }\n\n  it('壳态路由内容包裹层增 flex min-h-0 flex-col 类（高度链起点），既有留白类不回归', async () => {\n    await restored();\n\n    const wrapper = shellContentWrapper();\n    for (const className of [\n      'mx-auto',\n      'flex',\n      'min-h-0',\n      'w-full',\n      'flex-1',\n      'flex-col',\n      'px-4',\n      'py-4',\n    ]) {\n      expect(wrapper.className).toContain(className);\n    }\n    // 高度链起点在壳层语义内：包裹层即路由页 flex 容器（AppRoutes 直接子级）\n    expect(wrapper.contains(screen.getByText('add-feature'))).toBe(true);\n  });\n\n  it('切页往返（changes → db → changes）包裹层框架类稳定，清单 / 数据库页呈现不回归', async () => {\n    await restored();\n\n    fireEvent.click(screen.getByTestId('nav-db'));\n    await waitFor(() => expect(screen.getByTestId('db-model-list') !== null).toBe(true));\n    for (const className of ['flex', 'min-h-0', 'flex-1', 'flex-col']) {\n      expect(shellContentWrapper().className).toContain(className);\n    }\n\n    fireEvent.click(screen.getByTestId('nav-changes'));\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n    for (const className of ['flex', 'min-h-0', 'flex-1', 'flex-col']) {\n      expect(shellContentWrapper().className).toContain(className);\n    }\n    // 非滚动场景页为内容自适应 flex item：切页往返后清单照常呈现\n    expect(screen.getByTestId('nav-changes').getAttribute('data-active')).toBe('true');\n  });\n});\n\n// ---------------------------------------------------------------------------\n// HashRouter 自含挂载与路由初态（design D2/D6/D7）：render(<"+"App />) 不包任何\n// Router 即得路由（D2 收敛点）；启动 tion.hash = '#/agent';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByTestId('agent-run-form') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/agent');\n    expect(screen.getByTestId('nav-agent').getAttribute('data-active')).toBe('true');\n    expect(screen.getByTestId('nav-changes').getAttribute('data-active')).toBe('false');\n    // Agent 页不挂 ChangeView：无 detail 取数\n    expect(countOf('get_change_detail')).toBe(0);\n  });\n\n  it('启动前 hash 为未知路径（#/bogus）：兜底落 #/changes 渲染清单，不空白不崩', async () => {\n    window.location.hash = '#/bogus';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/changes');\n    // 落清单而非详情：无详情标题\n    expect(screen.queryByRole('heading', { name: 'add-feature' })).toBeNull();\n    expect(countOf('get_change_detail')).toBe(0);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 关系五：/info 基础信息路由（AC-1）——侧栏 nav-info → HashRouter /info 路由项\n// → InfoView 真实挂载（AppRoutes / InfoView / useCodeStats 不 mock，进程边界\n// 收敛于 invoke 的 code_stats 分支）。路由表为组合声明文件、无独立测试路径，\n// 按链路入口挂靠规则以本套件组合用例承载（/info 路由项 + * 兜底回归 +\n// 欢迎态隔离）。\n// ---------------------------------------------------------------------------\n\ndescribe('App：/info 基础信息路由可达与欢迎态隔离（AC-1）', () => {\n  beforeEach(() => {\n    // 路由化后 App 自含 HashRouter（design D6）：jsdom location 跨用例存活，\n    // 上一用例残留的 hash 会改变下一用例启动路由初态，先重置\n    window.location.hash = '';\n    getVersionMock.mockReset();\n    invokeMock.mockReset();\n    openMock.mockReset();\n    checkMock.mockReset();\n    checkMock.mockResolvedValue(null);\n    getVersionMock.mockResolvedValue('0.1.0');\n    toast.dismiss();\n    mockIpc();\n  });\n\n  afterEach(() => {\n    vi.unstubAllEnvs();\n  });\n\n  it('壳态点击 nav-info：hash 落 #/info、基础信息页呈现（info-summary 在场）、变更页内容卸载、nav-info 激活', async () => {\n    await restored();\n\n    fireEvent.click(screen.getByTestId('nav-info'));\n\n    await waitFor(() => expect(window.location.hash).toBe('#/info'));\n    await waitFor(() => expect(screen.getByTestId('info-summary') !== null).toBe(true));\n    expect(screen.queryByText('add-feature')).toBeNull();\n    expect(screen.getByTestId('nav-info').getAttribute('data-active')).toBe('true');\n    expect(screen.getByTestId('nav-changes').getAttribute('data-active')).toBe('false');\n    // InfoView 挂载即以 (root, depth=5) 发起解析\n    expect(invokeMock).toHaveBeenCalledWith('code_stats', { root: FIRST.root, depth: 5 });\n  });\n\n  it('启动前 hash 已为 #/info：深链直出基础信息页且 nav-info 激活（对齐既有深链用例形态）', async () => {\n    window.location.hash = '#/info';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByTestId('info-summary') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/info');\n    expect(screen.getByTestId('nav-info').getAttribute('data-active')).toBe('true');\n    expect(screen.getByTestId('nav-changes').getAttribute('data-active')).toBe('false');\n    expect(countOf('code_stats')).toBe(1);\n    // 变更页未挂载：无 change 内容、无详情取数\n    expect(screen.queryByText('add-feature')).toBeNull();\n    expect(countOf('get_change_detail')).toBe(0);\n  });\n\n  it('未知路径兜底回归：#/bogus 仍兜底落 #/changes（/info 插入不破 * 兜底语义）、不误触 code_stats', async () => {\n    window.location.hash = '#/bogus';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/changes');\n    expect(screen.queryByTestId('info-view')).toBeNull();\n    expect(countOf('code_stats')).toBe(0);\n  });\n\n  it('#/info/xyz（路由表无 /info 子段）：兜底落 #/changes，不空白不崩', async () => {\n    window.location.hash = '#/info/xyz';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/changes');\n    expect(screen.queryByTestId('info-view')).toBeNull();\n    expect(countOf('code_stats')).toBe(0);\n  });\n\n  it('欢迎态（root=null）：无壳无 nav-info，#/info 不渲染基础信息页、仅欢迎屏（无 Router 挂壳的隔离）', async () => {\n    window.location.hash = '#/info';\n    remaining = [];\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('添加新文件夹') !== null).toBe(true));\n\n    expect(document.querySelector('[data-slot=\"sidebar-wrapper\"]')).toBeNull();\n    expect(screen.queryByTestId('nav-info')).toBeNull();\n    expect(screen.queryByTestId('info-view')).toBeNull();\n    expect(screen.getByText(/还没有记录/) !== null).toBe(true);\n    expect(countOf('code_stats')).toBe(0);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 关系六：/config 配置路由（AC-4 / AC-6 / AC-7 / AC-8）——侧栏 nav-config →\n// HashRouter /config 路由项 → ConfigView 真实挂载（AppRoutes / ConfigView /\n// useWorkspaceConfig 不 mock，进程边界收敛于 invoke 的 workspace_config 分支，\n// /info 路由套件先例同型）。路由表为组合声明文件、无独立测试路径，按链路\n// 入口挂靠规则以本套件组合用例承载。\n// ---------------------------------------------------------------------------\n\ndescribe('App：/config 配置路由可达与欢迎态隔离（AC-4/AC-6/AC-7）', () => {\n  beforeEach(() => {\n    // 路由化后 App 自含 HashRouter（design D6）：jsdom location 跨用例存活，\n    // 上一用例残留的 hash 会改变下一用例启动路由初态，先重置\n    window.location.hash = '';\n    getVersionMock.mockReset();\n    invokeMock.mockReset();\n    openMock.mockReset();\n    checkMock.mockReset();\n    checkMock.mockResolvedValue(null);\n    getVersionMock.mockResolvedValue('0.1.0');\n    toast.dismiss();\n    mockIpc();\n  });\n\n  afterEach(() => {\n    vi.unstubAllEnvs();\n  });\n\n  it('壳态点击 nav-config：hash 落 #/config、config-view 在场、nav-config 激活、变更页内容卸载、workspace_config 以 { root: 当前根 } 发起', async () => {\n    await restored();\n\n    fireEvent.click(screen.getByTestId('nav-config'));\n\n    await waitFor(() => expect(window.location.hash).toBe('#/config'));\n    // config-view 根节点 loading 期即在场：以数据到达后的分区在场为准\n    await waitFor(() => expect(screen.getByTestId('config-basic') !== null).toBe(true));\n    expect(screen.queryByText('add-feature')).toBeNull();\n    expect(screen.getByTestId('nav-config').getAttribute('data-active')).toBe('true');\n    expect(screen.getByTestId('nav-changes').getAttribute('data-active')).toBe('false');\n    expect(invokeMock).toHaveBeenCalledWith('workspace_config', { root: FIRST.root });\n  });\n\n  it('启动前 hash 已为 #/config：深链直出配置页且 nav-config 激活，恰发起一次解析（对齐 /info 深链用例形态）', async () => {\n    window.location.hash = '#/config';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByTestId('config-basic') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/config');\n    expect(screen.getByTestId('nav-config').getAttribute('data-active')).toBe('true');\n    expect(countOf('workspace_config')).toBe(1);\n    // 变更页未挂载：无 change 内容、无详情取数\n    expect(screen.queryByText('add-feature')).toBeNull();\n    expect(countOf('get_change_detail')).toBe(0);\n  });\n\n  it('未知路径兜底回归：#/bogus 仍兜底落 #/changes（/config 插入不破 * 兜底语义）、不误触 workspace_config', async () => {\n    window.location.hash = '#/bogus';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/changes');\n    expect(screen.queryByTestId('config-view')).toBeNull();\n    expect(countOf('workspace_config')).toBe(0);\n  });\n\n  it('#/config/xyz（路由表无子段）：兜底落 #/changes、不空白不崩', async () => {\n    window.location.hash = '#/config/xyz';\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n\n    expect(window.location.hash).toBe('#/changes');\n    expect(screen.queryByTestId('config-view')).toBeNull();\n    expect(countOf('workspace_config')).toBe(0);\n  });\n\n  it('欢迎态（root=null）：无壳无 nav-config，#/config 不渲染配置页仅欢迎屏、解析零发起（AC-4 后半）', async () => {\n    window.location.hash = '#/config';\n    remaining = [];\n    render(<"+"App />);\n\n    await waitFor(() => expect(screen.getByText('添加新文件夹') !== null).toBe(true));\n\n    expect(document.querySelector('[data-slot=\"sidebar-wrapper\"]')).toBeNull();\n    expect(screen.queryByTestId('nav-config')).toBeNull();\n    expect(screen.queryByTestId('config-view')).toBeNull();\n    expect(screen.getByText(/还没有记录/) !== null).toBe(true);\n    expect(countOf('workspace_config')).toBe(0);\n  });\n\n  it('workspace_config reject（含无效 root Err reject）：config-error inline 呈现、无 toast 顶替、壳不崩（AC-7 全链核对）', async () => {\n    await restored();\n\n    configReject = 'root 无效（C:\\\\demo\\\\alpha）：不存在';\n    fireEvent.click(screen.getByTestId('nav-config'));\n\n    await waitFor(() => expect(screen.getByTestId('config-error') !== null).toBe(true));\n    expect(screen.getByTestId('config-error').textContent).toContain('解析失败');\n    expect(screen.getByTestId('config-error').textContent).toContain('root 无效');\n    // inline 持久、无 toast 顶替\n    await act(async () => {\n      await new Promise((resolve) => setTimeout(resolve, 20));\n    });\n    expect(screen.getByTestId('config-error') !== null).toBe(true);\n    expect(document.querySelector('[data-sonner-toast]')).toBeNull();\n\n    // 壳不崩：可切回变更页\n    fireEvent.click(screen.getByTestId('nav-changes'));\n    await waitFor(() => expect(screen.getByText('add-feature') !== null).toBe(true));\n  });\n\n  it('切换 workspace（sidebar 清单项）后停留 /config：以新根重发 workspace_config、旧根配置不呈现（AC-6 切换重取的壳层核对）', async () => {\n    await restored();\n\n    fireEvent.click(screen.getByTestId('nav-config'));\n    await waitFor(() =>\n      expect(screen.getByTestId('config-view').textContent).toContain(FIRST.root),\n    );\n\n    fireEvent.click(itemByRoot(SECOND.root));\n\n    await waitFor(() =>\n      expect(invokeMock).toHaveBeenCalledWith('workspace_config', { root: SECOND.root }),\n    );\n    await waitFor(() =>\n      expect(screen.getByTestId('config-view').textContent).toContain(SECOND.root),\n    );\n    // 旧根配置不呈现、恰以新旧根各重取一次\n    expect(screen.getByTestId('config-view').textContent).not.toContain(FIRST.root);\n    const configRoots = invokeMock.mock.calls\n      .filter(([name]) => name === 'workspace_config')\n      .map(([, params]) => (params as { root: string }).root);\n    expect(configRoots).toEqual([FIRST.root, SECOND.root]);\n  });\n});\n"},"src/views/agent/agent-debug-view.test.tsx":{"tests":[{"id":"57","name":"AgentDebugView → AgentTimeline 接线 渲染四区块：参数面、事件时间线（保真透镜）、原始 JSONL 切换入口、历史运行区"},{"id":"58","name":"AgentDebugView → AgentTimeline 接线 root=null 时启动入口缺席：页面自呈现提示、不崩"},{"id":"59","name":"AgentDebugView → AgentTimeline 接线 运行后事件与终态 record 经 AgentTimeline 全量呈现（event-result / event-run-record 可见）"},{"id":"60","name":"AgentDebugView → AgentTimeline 接线 原始 JSONL 切换二选一：AgentRawStream 消费 chat 的 events 镜像逐事件 dump，切回时间线"},{"id":"61","name":"AgentDebugView：停止入口与收敛呈现 非运行态无停止入口"},{"id":"62","name":"AgentDebugView：停止入口与收敛呈现 running 中表单禁用且 chrome 停止按钮在场，点击调 stop 恰一次"},{"id":"63","name":"AgentDebugView：停止入口与收敛呈现 停止后终态 record 回流：event-run-record 呈现、running 复位、表单恢复可用"},{"id":"64","name":"AgentDebugView：停止入口与收敛呈现 运行发起失败（agent_start reject）呈现错误横幅"},{"id":"65","name":"AgentDebugView：区域滚动框架 根节点呈 flex 填充、流视图区（时间线 / 原始 JSONL 二选一）flex-1 填充"},{"id":"66","name":"AgentDebugView：调试页引擎选择（初始 sdk） 参数面呈现 engine 二值下拉且初始 sdk；不动下拉发起 → invoke 入参 engine 为 \"sdk\"（与后端默认一致）"},{"id":"67","name":"AgentDebugView：调试页引擎选择（初始 sdk） 切至 cli 后发起 → start 透传 input.engine 至 sendMessage，invoke 入参 engine 为 \"cli\""},{"id":"68","name":"AgentDebugView：调试页引擎选择（初始 sdk） sdk 运行的 ToolUse / ToolResult 成对事件经既有时间线组件呈现，终态 record 回流（呈现面零改动复用）"},{"id":"69","name":"AgentDebugView：调试页引擎选择（初始 sdk） SDK 启动失败（ConfigMissing 错误串）→ run-error 横幅呈现错误串（Err 抵达前端）"}],"source":"// @vitest-environment jsdom\nimport { act, fireEvent, render, screen, waitFor } from '@testing-library/react';\nimport { beforeEach, describe, expect, it, vi } from 'vite-plus/test';\n\nimport type { AgentEvent, AgentRunRecord } from '../../types/dto';\nimport { AgentDebugView } from './agent-debug-view';\n\n// ---------------------------------------------------------------------------\n// 驱动方式（最小 mock 原则修订）：use-agent-chat / use-agent-run-history 为\n// 进程内内部协作者，不 mock——fixture 改经 mock invoke / Channel 信封流入真实\n// useAgentChat（eventsToUIMessages / runRecordToUIMessage 不在套件内直构）。\n// 唯一 mock 点为 @tauri-apps/api/core 进程边界：invoke 按命令名分发\n// （agent_start / agent_stop / agent_runs / agent_run_events，可切换\n// resolve / reject / pending 并记录入参）；Channel 可编程 class 捕获\n// onmessage（测试直接投递 Event / Record 信封驱动实时流与终态回流）。\n// ---------------------------------------------------------------------------\n\nconst { ChannelMock, invokeMock } = vi.hoisted(() => {\n  class ChannelMock {\n    onmessage: ((message: unknown) => void) | null = null;\n    static instances: ChannelMock[] = [];\n    constructor() {\n      ChannelMock.instances.push(this);\n    }\n  }\n  return { ChannelMock, invokeMock: vi.fn() };\n});\n\nvi.mock('@tauri-apps/api/core', () => ({ invoke: invokeMock, Channel: ChannelMock }));\n\n// ---------------------------------------------------------------------------\n// fixture（serde camelCase 线格式，debug 形态：sourceRef / parentRunId 皆 null）\n// ---------------------------------------------------------------------------\n\nconst ROOT = 'C:\\\\demo\\\\beta';\n\nfunction run(id: number, status: AgentRunRecord['status']): AgentRunRecord {\n  return {\n    id,\n    prompt: '你好',\n    cwd: ROOT,\n    env: 'default',\n    permissionMode: 'bypassPermissions',\n    status,\n    startedAt: 1727000000000,\n    finishedAt: status === 'running' ? null : 1727000001000,\n    numTurns: status === 'running' ? null : 3,\n    costUsd: status === 'running' ? null : 0.5,\n    durationMs: status === 'running' ? null : 1234,\n    sessionId: status === 'running' ? null : 's-1',\n    error: null,\n    source: 'debug',\n    sourceRef: null,\n    parentRunId: null,\n  };\n}\n\nfunction runStarted(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'runStarted',\n    model: 'claude-opus',\n    sessionId: 's-1',\n    tools: ['Bash'],\n    mcpServers: [],\n  };\n}\n\nfunction runResult(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000001,\n    kind: 'runResult',\n    subtype: 'success',\n    isError: false,\n    numTurns: 3,\n    durationMs: 1234,\n    costUsd: 0.5,\n    usage: {},\n    sessionId: 's-1',\n  };\n}\n\nlet startBehavior: { mode: 'resolve' | 'reject'; value: AgentRunRecord | string } | null = null;\n\nfunction mockIpc() {\n  ChannelMock.instances.length = 0;\n  startBehavior = { mode: 'resolve', value: run(1, 'running') };\n  invokeMock.mockReset();\n  invokeMock.mockImplementation((command: string) => {\n    if (command === 'agent_start') {\n      const behavior = startBehavior;\n      if (behavior?.mode === 'resolve') return Promise.resolve(behavior.value);\n      if (behavior?.mode === 'reject') return Promise.reject(behavior.value);\n      return new Promise<"+"AgentRunRecord>(() => {});\n    }\n    if (command === 'agent_stop') return Promise.resolve(null);\n    if (command === 'agent_runs') return Promise.resolve([]);\n    if (command === 'agent_run_events') return Promise.resolve([]);\n    return Promise.resolve(null);\n  });\n}\n\nbeforeEach(() => {\n  mockIpc();\n});\n\n// ---------------------------------------------------------------------------\n// 装置\n// ---------------------------------------------------------------------------\n\ninterface ChannelLike {\n  onmessage: ((message: unknown) => void) | null;\n}\n\nfunction lastChannel(): ChannelLike {\n  const instance = ChannelMock.instances.at(-1);\n  if (!instance) throw new Error('尚未发起运行（无 Channel 实例）');\n  return instance;\n}\n\nfunction deliverEvent(event: AgentEvent) {\n  act(() => {\n    lastChannel().onmessage?.({ ipc: 'event', event });\n  });\n}\n\nfunction deliverRecord(record: AgentRunRecord) {\n  act(() => {\n    lastChannel().onmessage?.({ ipc: 'record', record });\n  });\n}\n\n/** 发起一次运行：填 prompt 后点击启动（页面真实表单路径）。 */\nasync function startRun(prompt = '你好') {\n  fireEvent.change(screen.getByTestId('agent-prompt'), { target: { value: prompt } });\n  fireEvent.click(screen.getByTestId('agent-start'));\n  await act(async () => {});\n}\n\n// ---------------------------------------------------------------------------\n// 页面接线（真实组合）\n// ---------------------------------------------------------------------------\n\ndescribe('AgentDebugView → AgentTimeline 接线', () => {\n  it('渲染四区块：参数面、事件时间线（保真透镜）、原始 JSONL 切换入口、历史运行区', () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n\n    expect(screen.getByTestId('agent-run-form') !== null).toBe(true);\n    expect(screen.getByTestId('agent-timeline') !== null).toBe(true);\n    expect(screen.getByTestId('stream-toggle') !== null).toBe(true);\n    expect(screen.getByTestId('agent-run-history') !== null).toBe(true);\n  });\n\n  it('root=null 时启动入口缺席：页面自呈现提示、不崩', () => {\n    render(<"+"AgentDebugView root={null} />);\n\n    expect(screen.getByTestId('agent-no-root') !== null).toBe(true);\n    expect(screen.queryByTestId('agent-run-form')).toBeNull();\n    expect(screen.queryByTestId('agent-start')).toBeNull();\n  });\n\n  it('运行后事件与终态 record 经 AgentTimeline 全量呈现（event-result / event-run-record 可见）', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n    await startRun();\n\n    deliverEvent(runStarted(0));\n    deliverEvent(runResult(1));\n    deliverRecord(run(1, 'completed'));\n    await waitFor(() => expect(screen.getByTestId('event-run-record') !== null).toBe(true));\n\n    expect(screen.getByTestId('event-run-started') !== null).toBe(true);\n    expect(screen.getByTestId('event-result') !== null).toBe(true);\n    expect(screen.getByTestId('result-num-turns').textContent).toBe('3');\n    expect(screen.getByTestId('event-run-record').getAttribute('data-status')).toBe('completed');\n  });\n\n  it('原始 JSONL 切换二选一：AgentRawStream 消费 chat 的 events 镜像逐事件 dump，切回时间线', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n    await startRun();\n\n    deliverEvent(runStarted(0));\n    deliverEvent(runResult(1));\n    await act(async () => {});\n\n    fireEvent.click(screen.getByTestId('toggle-raw'));\n    expect(screen.getByTestId('agent-raw-stream') !== null).toBe(true);\n    expect(screen.queryByTestId('agent-timeline')).toBeNull();\n    // events 镜像逐事件 dump（camelCase 线格式）\n    expect(screen.getAllByTestId('raw-line')).toHaveLength(2);\n    expect(screen.getAllByTestId('raw-line')[0]?.textContent).toContain('runStarted');\n\n    fireEvent.click(screen.getByTestId('toggle-timeline'));\n    expect(screen.getByTestId('agent-timeline') !== null).toBe(true);\n    expect(screen.queryByTestId('agent-raw-stream')).toBeNull();\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 停止入口与停止后收敛（AC-6 触发后事件流与状态收敛的呈现半边）\n// ---------------------------------------------------------------------------\n\ndescribe('AgentDebugView：停止入口与收敛呈现', () => {\n  it('非运行态无停止入口', () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n\n    expect(screen.queryByTestId('run-stop')).toBeNull();\n    expect(screen.queryAllByText(/(停止|取消|终止|中断|kill)/i)).toHaveLength(0);\n  });\n\n  it('running 中表单禁用且 chrome 停止按钮在场，点击调 stop 恰一次', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n    // agent_start 提前 resolve running 记录（currentRunId 确立）；流保持打开直至\n    // 终态 record 信封——stop 寻址的稳定 running 场景\n    await startRun();\n    await waitFor(() => expect(screen.getByTestId('run-stop') !== null).toBe(true));\n    expect(screen.getByTestId('agent-start').hasAttribute('disabled')).toBe(true);\n\n    fireEvent.click(screen.getByTestId('run-stop'));\n    await act(async () => {});\n\n    const stopCalls = invokeMock.mock.calls.filter(([name]) => name === 'agent_stop');\n    expect(stopCalls).toHaveLength(1);\n    expect(stopCalls[0]).toEqual(['agent_stop', { root: ROOT, runId: 1 }]);\n  });\n\n  it('停止后终态 record 回流：event-run-record 呈现、running 复位、表单恢复可用', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n    // 提前 resolve running 记录 + 流保持打开：stop 寻址可用、running 态稳定\n    await startRun();\n    await waitFor(() => expect(screen.getByTestId('run-stop') !== null).toBe(true));\n\n    fireEvent.click(screen.getByTestId('run-stop'));\n    await act(async () => {});\n    deliverEvent(runStarted(0));\n    deliverRecord(run(1, 'stopped'));\n\n    await waitFor(() => expect(screen.queryByTestId('run-stop')).toBeNull());\n    expect(screen.getByTestId('event-run-record').getAttribute('data-status')).toBe('stopped');\n    expect(screen.getByTestId('agent-start').hasAttribute('disabled')).toBe(false);\n  });\n\n  it('运行发起失败（agent_start reject）呈现错误横幅', async () => {\n    startBehavior = { mode: 'reject', value: 'CLI 未找到' };\n    render(<"+"AgentDebugView root={ROOT} />);\n    await startRun();\n\n    await waitFor(() => expect(screen.getByTestId('run-error') !== null).toBe(true));\n    expect(screen.getByTestId('run-error').textContent).toContain('CLI 未找到');\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 区域滚动框架（jsdom className 结构代理）\n// ---------------------------------------------------------------------------\n\ndescribe('AgentDebugView：区域滚动框架', () => {\n  it('根节点呈 flex 填充、流视图区（时间线 / 原始 JSONL 二选一）flex-1 填充', async () => {\n    const { container } = render(<"+"AgentDebugView root={ROOT} />);\n    await startRun();\n    deliverEvent(runStarted(0));\n    await act(async () => {});\n\n    // 根节点接入壳层 flex 链\n    const rootDiv = container.firstElementChild;\n    for (const className of ['flex', 'min-h-0', 'flex-1', 'flex-col']) {\n      expect(rootDiv?.className).toContain(className);\n    }\n    // 流视图区（时间线态）flex-1 填充\n    expect(screen.getByTestId('agent-timeline').className).toContain('flex-1');\n\n    // 原始 JSONL 态同样 flex-1 填充\n    fireEvent.click(screen.getByTestId('toggle-raw'));\n    const rawSection = screen.getByTestId('agent-raw-stream');\n    for (const className of ['flex', 'min-h-0', 'flex-1', 'flex-col']) {\n      expect(rawSection.className).toContain(className);\n    }\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 调试页引擎选择（AC-9）：engine 二值下拉初始 sdk（与后端 DEFAULT_ENGINE\n// 一致）；start 透传 input.engine 至 sendMessage；显式 cli 为调试页可选项；\n// sdk 运行复用既有时间线 / 落库 / 重放呈现面\n// ---------------------------------------------------------------------------\n\n/** sdk 形态事件 fixture：ToolUse / ToolResult 成对 + 思考块。 */\nfunction toolUseEvent(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'message',\n    role: 'assistant',\n    blocks: [\n      { kind: 'thinking', thinking: '先读文件' },\n      { kind: 'toolUse', id: 'tu_sdk_1', name: 'read', input: { path: 'a.txt' } },\n    ],\n    parentToolUseId: null,\n  };\n}\n\nfunction toolResultEvent(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000001,\n    kind: 'message',\n    role: 'user',\n    blocks: [{ kind: 'toolResult', id: 'tu_sdk_1', content: '文件内容 🎉', isError: false }],\n    parentToolUseId: null,\n  };\n}\n\nfunction startCallEngine(): unknown {\n  const call = invokeMock.mock.calls.filter(([name]) => name === 'agent_start').at(-1);\n  if (!call) throw new Error('agent_start 未被调用');\n  return (call[1] as Record<"+"string, unknown>)['engine'];\n}\n\ndescribe('AgentDebugView：调试页引擎选择（初始 sdk）', () => {\n  it('参数面呈现 engine 二值下拉且初始 sdk；不动下拉发起 → invoke 入参 engine 为 \"sdk\"（与后端默认一致）', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n\n    const engineSelect = screen.getByTestId('agent-engine') as HTMLSelectElement;\n    expect(engineSelect.value).toBe('sdk');\n    const values = Array.from(engineSelect.options).map((option) => option.value);\n    expect(values).toEqual(['cli', 'sdk']);\n\n    await startRun();\n    expect(startCallEngine()).toBe('sdk');\n  });\n\n  it('切至 cli 后发起 → start 透传 input.engine 至 sendMessage，invoke 入参 engine 为 \"cli\"', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n\n    fireEvent.change(screen.getByTestId('agent-engine'), { target: { value: 'cli' } });\n    await startRun('显式 cli 调试轮');\n\n    expect(startCallEngine()).toBe('cli');\n  });\n\n  it('sdk 运行的 ToolUse / ToolResult 成对事件经既有时间线组件呈现，终态 record 回流（呈现面零改动复用）', async () => {\n    render(<"+"AgentDebugView root={ROOT} />);\n    await startRun();\n\n    deliverEvent(toolUseEvent(0));\n    deliverEvent(toolResultEvent(1));\n    deliverEvent(runResult(2));\n    deliverRecord(run(1, 'completed'));\n    await waitFor(() => expect(screen.getByTestId('event-run-record') !== null).toBe(true));\n\n    // 成对块经既有时间线保真透镜呈现（block 级 testid 复用）\n    expect(screen.getByTestId('block-tool-use').getAttribute('data-tool-id')).toBe('tu_sdk_1');\n    expect(screen.getByTestId('block-tool-result').textContent).toContain('文件内容 🎉');\n    expect(screen.getByTestId('event-run-record').getAttribute('data-status')).toBe('completed');\n  });\n\n  it('SDK 启动失败（ConfigMissing 错误串）→ run-error 横幅呈现错误串（Err 抵达前端）', async () => {\n    startBehavior = {\n      mode: 'reject',\n      value: '配置缺失: 配置项未填: api_key / base_url / model（引擎配置硬编码位未手填）',\n    };\n    render(<"+"AgentDebugView root={ROOT} />);\n    await startRun();\n\n    await waitFor(() => expect(screen.getByTestId('run-error') !== null).toBe(true));\n    expect(screen.getByTestId('run-error').textContent).toContain('配置缺失');\n    expect(screen.getByTestId('run-error').textContent).toContain('api_key');\n  });\n});\n"},"src/hooks/use-agent-chat.test.ts":{"tests":[{"id":"70","name":"useAgentChat：重放装载 挂载发起 agent_run_chain 携 (root, source, sourceRef) 三参 + 逐 run agent_run_events 携 (root, run.id)，经适配层重建消息；链镜像与查询一致"},{"id":"71","name":"useAgentChat：重放装载 重放装载重建的 messages 与同批事件经 transport 实时流入 useChat 的终态形状一致（两路同构）"},{"id":"72","name":"useAgentChat：发送组装与停止 sendMessage 经 body 携带链尾非 running 记录的 resumeSessionId / parentRunId，三元组与 root 透传 agent_start"},{"id":"73","name":"useAgentChat：发送组装与停止 stop() 调 invoke(\"agent_stop\", { root, runId }) 复合键寻址且不截断前端流：Record 回流后 running 复位、消息含 record 部件"},{"id":"74","name":"useAgentChat：发送组装与停止 状态 submitted/streaming 期间重复 sendMessage 被忽略，不并发第二条 run"},{"id":"75","name":"useAgentChat：发送组装与停止 agent_start reject → error 置位、running 复位、既有 messages 不丢"},{"id":"76","name":"useAgentChat：边界 链尾记录为 running（stop 后终态 record 未达）→ 发送取上一条非 running 记录的链尾参数"},{"id":"77","name":"useAgentChat：边界 空链时 resume / parent 参数不携带（null），来源三元组仍齐全"},{"id":"78","name":"useAgentChat：边界 root 为 null（未选定 workspace）：重放不发起、发送 no-op，不崩"},{"id":"79","name":"useAgentChat：边界 sourceRef 为 null（debug 场景）：不重放装载，发送以 null 穿透 source / 链参数，不崩"},{"id":"80","name":"useAgentChat：边界 reset() 清空 messages / events / chain / currentRunId（debug 页每跑重置场景）"},{"id":"81","name":"useAgentChat：发送组装 engine 穿透 sendMessage input.engine=\"sdk\" → body.engine=\"sdk\"（invoke 入参断言）"},{"id":"82","name":"useAgentChat：发送组装 engine 穿透 sendMessage input.engine=\"cli\" → body.engine=\"cli\"（调试链显式传值穿透）"},{"id":"83","name":"useAgentChat：发送组装 engine 穿透 input.engine 不传 → body.engine=null（缺席透传不注入，explore 链缺省安全）"},{"id":"84","name":"useAgentChat：发送组装 engine 穿透 input.engine 为类型面外运行时异常值（yolo）→ hook 不做清单校验原样入 body，由 transport readEngine 层拒绝（职责分界留痕）"},{"id":"85","name":"useAgentChat：发送组装 engine 穿透 engine 增补后 resumeSessionId / parentRunId / 来源三元组组装不变（互不串线，body 逐字段断言）"},{"id":"86","name":"useAgentChat：生成绑定调用面 发起经生成绑定入口后 invoke 收到 \"agent_start\" 与 7 个 camelCase 链参数逐字不变，返回 running 记录透传"},{"id":"87","name":"useAgentChat：生成绑定调用面 逐 run 重放经生成绑定后 invoke 收到 \"agent_run_events\" 与 { root, runId }：空链零调用、多 run 逐 run 调用与消息重建不变"},{"id":"88","name":"useAgentChat：生成绑定调用面 停止经生成绑定后 invoke 收到 \"agent_stop\" 与 { root, runId }；reject 路径 error 置位 / running 复位行为不变"}],"source":"import { act, renderHook, waitFor } from '@testing-library/react';\nimport { beforeEach, describe, expect, it, vi } from 'vite-plus/test';\n\nimport { eventsToUIMessages, runRecordToUIMessage } from '../lib/agent-adapter';\nimport type { AgentEvent, AgentRunRecord } from '../types/dto';\nimport { useAgentChat, type UseAgentChatParams } from './use-agent-chat';\n\n// ---------------------------------------------------------------------------\n// 进程边界 Mock：invoke 按命令名分发（agent_run_chain / agent_run_events /\n// agent_start / agent_stop，可切换 resolve/reject 并记录入参）；Channel mock\n// 为可编程 class（捕获 onmessage，测试直接投递 Event / Record 信封驱动实时\n// 流与终态回流）。适配层与 transport 以真实实现参与，不 mock `ai` 的 useChat。\n// ---------------------------------------------------------------------------\n\nconst { ChannelMock, invokeMock } = vi.hoisted(() => {\n  class ChannelMock {\n    onmessage: ((message: unknown) => void) | null = null;\n    static instances: ChannelMock[] = [];\n    constructor() {\n      ChannelMock.instances.push(this);\n    }\n  }\n  return { ChannelMock, invokeMock: vi.fn() };\n});\n\nvi.mock('@tauri-apps/api/core', () => ({ invoke: invokeMock, Channel: ChannelMock }));\n\n// ---------------------------------------------------------------------------\n// fixture（serde camelCase 线格式）\n// ---------------------------------------------------------------------------\n\nconst ROOT = 'C:\\\\demo\\\\alpha';\nconst SOURCE_REF = '7';\n\nconst DEBUG_PARAMS: UseAgentChatParams = { source: 'explore', sourceRef: SOURCE_REF, root: ROOT };\n\nfunction run(\n  id: number,\n  sessionId: string | null,\n  parentRunId: number | null,\n  status: AgentRunRecord['status'] = 'completed',\n): AgentRunRecord {\n  return {\n    id,\n    prompt: `explore 轮次 ${id}`,\n    cwd: ROOT,\n    env: 'default',\n    permissionMode: 'bypassPermissions',\n    status,\n    startedAt: 1727000000000 + id,\n    finishedAt: status === 'running' ? null : 1727000001000 + id,\n    numTurns: status === 'running' ? null : 1,\n    costUsd: status === 'running' ? null : 0.1,\n    durationMs: status === 'running' ? null : 500,\n    sessionId: status === 'running' ? null : sessionId,\n    error: null,\n    source: 'explore',\n    sourceRef: SOURCE_REF,\n    parentRunId,\n  };\n}\n\nfunction textEvent(seq: number, text: string): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'message',\n    role: 'assistant',\n    blocks: [{ kind: 'text', text }],\n    parentToolUseId: null,\n  };\n}\n\nfunction runStarted(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'runStarted',\n    model: 'claude-opus',\n    sessionId: 's-1',\n    tools: ['Bash'],\n    mcpServers: [],\n  };\n}\n\nfunction runResultEvent(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'runResult',\n    subtype: 'success',\n    isError: false,\n    numTurns: 1,\n    durationMs: 500,\n    costUsd: 0.1,\n    usage: {},\n    sessionId: 's-tail',\n  };\n}\n\n/** 链 fixture：两条 parent_run_id 相连的 completed run（链头在前）。 */\nconst CHAIN = [run(11, 's-first', null), run(12, 's-tail', 11)];\n\nconst SEND_INPUT = {\n  prompt: '继续追这条线索',\n  permissionMode: 'bypassPermissions' as const,\n};\n\n// ---------------------------------------------------------------------------\n// IPC 编排\n// ---------------------------------------------------------------------------\n\nlet chainResult: AgentRunRecord[];\nlet eventsByRun: Map<"+"number, AgentEvent[]>;\nlet startBehavior: { mode: 'resolve' | 'reject'; value: AgentRunRecord | string } | null = null;\nlet startCalls: number;\n\nfunction mockIpc() {\n  ChannelMock.instances.length = 0;\n  chainResult = CHAIN.map((item) => ({ ...item }));\n  eventsByRun = new Map<"+"number, AgentEvent[]>([\n    [11, [textEvent(0, '首轮结论')]],\n    [12, [textEvent(0, '续轮结论'), runResultEvent(1)]],\n  ]);\n  startBehavior = null;\n  startCalls = 0;\n  invokeMock.mockReset();\n  invokeMock.mockImplementation((command: string, params?: Record<"+"string, unknown>) => {\n    if (command === 'agent_run_chain') {\n      return Promise.resolve(chainResult);\n    }\n    if (command === 'agent_run_events') {\n      return Promise.resolve(eventsByRun.get(Number(params?.runId)) ?? []);\n    }\n    if (command === 'agent_start') {\n      startCalls += 1;\n      const behavior = startBehavior;\n      if (behavior === null || behavior.mode === 'resolve') {\n        return Promise.resolve(behavior === null ? run(13, null, null, 'running') : behavior.value);\n      }\n      return Promise.reject(behavior.value);\n    }\n    if (command === 'agent_stop') {\n      return Promise.resolve(null);\n    }\n    return Promise.resolve(null);\n  });\n}\n\nbeforeEach(() => {\n  mockIpc();\n});\n\n// ---------------------------------------------------------------------------\n// 装置\n// ---------------------------------------------------------------------------\n\ninterface ChannelLike {\n  onmessage: ((message: unknown) => void) | null;\n}\n\nfunction lastChannel(): ChannelLike {\n  const instance = ChannelMock.instances.at(-1);\n  if (!instance) throw new Error('send 未创建 Channel（尚未发起 agent_start）');\n  return instance;\n}\n\nfunction deliverEvent(event: AgentEvent) {\n  act(() => {\n    lastChannel().onmessage?.({ ipc: 'event', event });\n  });\n}\n\nfunction deliverRecord(row: AgentRunRecord) {\n  act(() => {\n    lastChannel().onmessage?.({ ipc: 'record', record: row });\n  });\n}\n\nasync function mounted(params: UseAgentChatParams = DEBUG_PARAMS) {\n  const rendered = renderHook(\n    (props: { params: UseAgentChatParams }) => useAgentChat(props.params),\n    {\n      initialProps: { params },\n    },\n  );\n  await act(async () => {});\n  return rendered;\n}\n\nfunction startCallArgs(): Record<"+"string, unknown> {\n  const call = invokeMock.mock.calls.filter(([name]) => name === 'agent_start').at(-1);\n  if (!call) throw new Error('agent_start 未被调用');\n  return call[1] as Record<"+"string, unknown>;\n}\n\n// ---------------------------------------------------------------------------\n// 重放装载（链还原 + 逐 run 事件重放）\n// ---------------------------------------------------------------------------\n\ndescribe('useAgentChat：重放装载', () => {\n  it('挂载发起 agent_run_chain 携 (root, source, sourceRef) 三参 + 逐 run agent_run_events 携 (root, run.id)，经适配层重建消息；链镜像与查询一致', async () => {\n    const { result } = await mounted();\n\n    const chainCalls = invokeMock.mock.calls.filter(([name]) => name === 'agent_run_chain');\n    expect(chainCalls).toEqual([\n      ['agent_run_chain', { root: ROOT, source: 'explore', sourceRef: SOURCE_REF }],\n    ]);\n    expect(result.current.chain).toEqual(CHAIN);\n    expect(result.current.events).toEqual([\n      textEvent(0, '首轮结论'),\n      textEvent(0, '续轮结论'),\n      runResultEvent(1),\n    ]);\n    expect(result.current.currentRunId).toBe(12);\n    expect(result.current.loading).toBe(false);\n    expect(result.current.error).toBeNull();\n    // 重建形状：逐 run 折叠 + 终态 record 部件交错（running 才省略 record）\n    expect(result.current.messages).toEqual([\n      ...eventsToUIMessages(eventsByRun.get(11) ?? []),\n      runRecordToUIMessage(CHAIN[0]),\n      ...eventsToUIMessages(eventsByRun.get(12) ?? []),\n      runRecordToUIMessage(CHAIN[1]),\n    ]);\n  });\n\n  it('重放装载重建的 messages 与同批事件经 transport 实时流入 useChat 的终态形状一致（两路同构）', async () => {\n    chainResult = [];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n    // 启动 resolve 的 running 记录确立 currentRunId，事件入桶\n    act(() => {\n      startBehavior = { mode: 'resolve', value: run(13, 's-new', 12, 'running') };\n    });\n    await act(async () => {});\n    const realtimeEvents = [runStarted(0), textEvent(1, '正文'), runResultEvent(2)];\n    for (const event of realtimeEvents) {\n      deliverEvent(event);\n    }\n    const terminal = run(13, 's-new', 12, 'completed');\n    deliverRecord(terminal);\n\n    await waitFor(() => expect(result.current.running).toBe(false));\n    // 收口归一后终态 = 折叠重建形状（重开恢复 = 重放的同构锚点）\n    expect(result.current.messages).toEqual([\n      ...eventsToUIMessages(realtimeEvents),\n      runRecordToUIMessage(terminal),\n    ]);\n    expect(result.current.events).toEqual(realtimeEvents);\n    expect(result.current.chain).toEqual([terminal]);\n    expect(result.current.currentRunId).toBe(13);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 发送组装 / stop 接线 / 运行门闩\n// ---------------------------------------------------------------------------\n\ndescribe('useAgentChat：发送组装与停止', () => {\n  it('sendMessage 经 body 携带链尾非 running 记录的 resumeSessionId / parentRunId，三元组与 root 透传 agent_start', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    expect(args).toMatchObject({\n      root: ROOT,\n      prompt: SEND_INPUT.prompt,\n      permissionMode: 'bypassPermissions',\n      resumeSessionId: 's-tail',\n      parentRunId: 12,\n      source: 'explore',\n      sourceRef: SOURCE_REF,\n    });\n    expect(args['onEvent']).toBeInstanceOf(ChannelMock);\n  });\n\n  it('stop() 调 invoke(\"agent_stop\", { root, runId }) 复合键寻址且不截断前端流：Record 回流后 running 复位、消息含 record 部件', async () => {\n    chainResult = [];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n    act(() => {\n      startBehavior = { mode: 'resolve', value: run(13, null, null, 'running') };\n    });\n    await act(async () => {});\n    deliverEvent(textEvent(0, '停止前已产出'));\n\n    act(() => {\n      result.current.stop();\n    });\n    await act(async () => {});\n    expect(invokeMock).toHaveBeenCalledWith('agent_stop', { root: ROOT, runId: 13 });\n\n    // 前端流不被截断：stop 后终态 record 经 Channel 回流并复位 running\n    const terminal = run(13, null, null, 'stopped');\n    deliverRecord(terminal);\n    await waitFor(() => expect(result.current.running).toBe(false));\n\n    const stopCalls = invokeMock.mock.calls.filter(([name]) => name === 'agent_stop');\n    expect(stopCalls).toHaveLength(1);\n    expect(result.current.messages).toEqual([\n      ...eventsToUIMessages([textEvent(0, '停止前已产出')]),\n      runRecordToUIMessage(terminal),\n    ]);\n    expect(result.current.chain).toEqual([terminal]);\n  });\n\n  it('状态 submitted/streaming 期间重复 sendMessage 被忽略，不并发第二条 run', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n\n    act(() => {\n      result.current.sendMessage({ ...SEND_INPUT, prompt: '并发第二条' });\n    });\n    await act(async () => {});\n    expect(startCalls).toBe(1);\n\n    // 收尾解锁：终态 record 回流后恢复可发\n    act(() => {\n      startBehavior = { mode: 'resolve', value: run(13, null, null, 'running') };\n    });\n    await act(async () => {});\n    deliverRecord(run(13, null, null, 'completed'));\n    await waitFor(() => expect(result.current.running).toBe(false));\n    expect(startCalls).toBe(1);\n  });\n\n  it('agent_start reject → error 置位、running 复位、既有 messages 不丢', async () => {\n    const { result } = await mounted();\n    const before = result.current.messages;\n    expect(before.length).toBeGreaterThan(0);\n\n    startBehavior = { mode: 'reject', value: '启动失败' };\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n\n    await waitFor(() => expect(result.current.running).toBe(false));\n    expect(result.current.error).toContain('启动失败');\n    expect(result.current.messages).toEqual(before);\n    expect(result.current.chain).toEqual(CHAIN);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 边界：链尾 running 过滤 / 空链 / null 守卫 / reset\n// ---------------------------------------------------------------------------\n\ndescribe('useAgentChat：边界', () => {\n  it('链尾记录为 running（stop 后终态 record 未达）→ 发送取上一条非 running 记录的链尾参数', async () => {\n    chainResult = [run(11, 's-first', null), run(12, null, 11, 'running')];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await
