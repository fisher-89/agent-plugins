act(async () => {});\n\n    const args = startCallArgs();\n    expect(args['resumeSessionId']).toBe('s-first');\n    expect(args['parentRunId']).toBe(11);\n  });\n\n  it('空链时 resume / parent 参数不携带（null），来源三元组仍齐全', async () => {\n    chainResult = [];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    expect(args['resumeSessionId']).toBeNull();\n    expect(args['parentRunId']).toBeNull();\n    expect(args['source']).toBe('explore');\n    expect(args['sourceRef']).toBe(SOURCE_REF);\n  });\n\n  it('root 为 null（未选定 workspace）：重放不发起、发送 no-op，不崩', async () => {\n    const { result } = await mounted({ ...DEBUG_PARAMS, root: null });\n\n    expect(invokeMock).not.toHaveBeenCalled();\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    expect(invokeMock).not.toHaveBeenCalled();\n    expect(result.current.running).toBe(false);\n    expect(result.current.messages).toEqual([]);\n  });\n\n  it('sourceRef 为 null（debug 场景）：不重放装载，发送以 null 穿透 source / 链参数，不崩', async () => {\n    const { result } = await mounted({ source: 'debug', sourceRef: null, root: ROOT });\n\n    expect(invokeMock).not.toHaveBeenCalled();\n    expect(result.current.messages).toEqual([]);\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    expect(args['source']).toBe('debug');\n    expect(args['sourceRef']).toBeNull();\n    expect(args['resumeSessionId']).toBeNull();\n    expect(args['parentRunId']).toBeNull();\n  });\n\n  it('reset() 清空 messages / events / chain / currentRunId（debug 页每跑重置场景）', async () => {\n    const { result } = await mounted();\n    expect(result.current.chain).toHaveLength(2);\n\n    act(() => {\n      result.current.reset();\n    });\n\n    expect(result.current.messages).toEqual([]);\n    expect(result.current.events).toEqual([]);\n    expect(result.current.chain).toEqual([]);\n    expect(result.current.currentRunId).toBeNull();\n    // 重置后可正常发起新一轮：空链语义（resume / parent 缺省 null）\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await act(async () => {});\n    const args = startCallArgs();\n    expect(args['resumeSessionId']).toBeNull();\n    expect(args['parentRunId']).toBeNull();\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 发送组装 engine 穿透（v2）：body 组装 `engine: input.engine ?? null`——\n// 缺席透传不注入（缺省裁决权归后端 unwrap_or(DEFAULT_ENGINE)；debug 链显式\n// 传、explore 等正式链缺席透传）\n// ---------------------------------------------------------------------------\n\ndescribe('useAgentChat：发送组装 engine 穿透', () => {\n  it('sendMessage input.engine=\"sdk\" → body.engine=\"sdk\"（invoke 入参断言）', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage({ ...SEND_INPUT, engine: 'sdk' });\n    });\n    await act(async () => {});\n\n    expect(startCallArgs()['engine']).toBe('sdk');\n  });\n\n  it('sendMessage input.engine=\"cli\" → body.engine=\"cli\"（调试链显式传值穿透）', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage({ ...SEND_INPUT, engine: 'cli' });\n    });\n    await act(async () => {});\n\n    expect(startCallArgs()['engine']).toBe('cli');\n  });\n\n  it('input.engine 不传 → body.engine=null（缺席透传不注入，explore 链缺省安全）', async () => {\n    // DEBUG_PARAMS 即 explore 形态（来源侧不传 engine）：explore 会话链\n    // 发送 body.engine=null → 后端缺省收敛 DEFAULT_ENGINE（Sdk）\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    expect(startCallArgs()['engine']).toBeNull();\n  });\n\n  it('input.engine 为类型面外运行时异常值（yolo）→ hook 不做清单校验原样入 body，由 transport readEngine 层拒绝（职责分界留痕）', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage({ ...SEND_INPUT, engine: 'yolo' as 'sdk' });\n    });\n    await waitFor(() => expect(result.current.error).toContain('非法 engine'));\n\n    // hook 本体不炸：error 置位、running 复位；拒绝发生在 transport 层\n    //（invoke 未发起），hook 侧零清单校验代码路径\n    expect(result.current.running).toBe(false);\n    expect(result.current.error).toContain('非法 engine');\n    expect(invokeMock.mock.calls.filter(([name]) => name === 'agent_start')).toHaveLength(0);\n  });\n\n  it('engine 增补后 resumeSessionId / parentRunId / 来源三元组组装不变（互不串线，body 逐字段断言）', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage({ ...SEND_INPUT, engine: 'sdk' });\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    expect(args['engine']).toBe('sdk');\n    expect(args['resumeSessionId']).toBe('s-tail');\n    expect(args['parentRunId']).toBe(12);\n    expect(args['root']).toBe(ROOT);\n    expect(args['source']).toBe('explore');\n    expect(args['sourceRef']).toBe(SOURCE_REF);\n    expect(args['prompt']).toBe(SEND_INPUT.prompt);\n    expect(args['permissionMode']).toBe('bypassPermissions');\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 生成绑定调用面（AC-5 回归锁定）：agent_run_chain / agent_run_events /\n// agent_stop 裸 invoke → typed bindings 机械替换后，invoke 命令名与 camelCase\n// 参数逐字不变（生成绑定底层仍走 @tauri-apps/api/core 的 invoke，mock 机制\n// 切换后依旧生效）；root 寻址参数随双库拆分（desktop-workspace-db-split）\n// 进入链还原与停止三条命令。\n// ---------------------------------------------------------------------------\n\ndescribe('useAgentChat：生成绑定调用面', () => {\n  it('发起经生成绑定入口后 invoke 收到 \"agent_start\" 与 7 个 camelCase 链参数逐字不变，返回 running 记录透传', async () => {\n    const { result } = await mounted();\n\n    // 链发起：命令名与 root 寻址三元组逐字不变\n    expect(invokeMock).toHaveBeenCalledWith('agent_run_chain', {\n      root: ROOT,\n      source: 'explore',\n      sourceRef: SOURCE_REF,\n    });\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n\n    // 生成绑定位置参数 → invoke 参数对象：恰 9 个 key（链参数 8 + onEvent）\n    // （engine 键恒在——transport 恒以第 9 位置参传 engine，缺席值 null）\n    const args = startCallArgs();\n    expect(Object.keys(args).sort()).toEqual([\n      'engine',\n      'onEvent',\n      'parentRunId',\n      'permissionMode',\n      'prompt',\n      'resumeSessionId',\n      'root',\n      'source',\n      'sourceRef',\n    ]);\n    expect(args).toMatchObject({\n      root: ROOT,\n      prompt: SEND_INPUT.prompt,\n      permissionMode: 'bypassPermissions',\n      engine: null,\n      resumeSessionId: 's-tail',\n      parentRunId: 12,\n      source: 'explore',\n      sourceRef: SOURCE_REF,\n    });\n    // 返回 running 记录透传（提前 resolve：running 置位、id 可寻址）\n    await waitFor(() => expect(result.current.currentRunId).toBe(13));\n    expect(result.current.running).toBe(true);\n  });\n\n  it('逐 run 重放经生成绑定后 invoke 收到 \"agent_run_events\" 与 { root, runId }：空链零调用、多 run 逐 run 调用与消息重建不变', async () => {\n    const { result } = await mounted();\n\n    // 多 run：每 run 恰一次重放调用，参数逐字 { root, runId }，消息重建不变\n    expect(invokeMock.mock.calls.filter(([name]) => name === 'agent_run_events')).toEqual([\n      ['agent_run_events', { root: ROOT, runId: 11 }],\n      ['agent_run_events', { root: ROOT, runId: 12 }],\n    ]);\n    // 消息重建不变：逐 run 事件折叠 + 终态 record 部件交错（1+1+2+1 = 5 条）\n    expect(result.current.messages).toHaveLength(5);\n\n    // 空链：零 agent_run_events 调用（空链语义在绑定切换后保持）\n    const callsBeforeEmpty = invokeMock.mock.calls.length;\n    chainResult = [];\n    const empty = await mounted();\n    expect(\n      invokeMock.mock.calls.slice(callsBeforeEmpty).filter(([name]) => name === 'agent_run_events'),\n    ).toHaveLength(0);\n    expect(empty.result.current.messages).toEqual([]);\n  });\n\n  it('停止经生成绑定后 invoke 收到 \"agent_stop\" 与 { root, runId }；reject 路径 error 置位 / running 复位行为不变', async () => {\n    chainResult = [];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n\n    act(() => {\n      result.current.stop();\n    });\n    await act(async () => {});\n    expect(invokeMock).toHaveBeenCalledWith('agent_stop', { root: ROOT, runId: 13 });\n\n    // 终态 record 回流后 running 复位（停止路径行为不变）\n    deliverRecord(run(13, null, null, 'stopped'));\n    await waitFor(() => expect(result.current.running).toBe(false));\n\n    // reject 路径：错误经生成绑定 reject 通道抵达，error 置位、running 复位\n    act(() => {\n      startBehavior = { mode: 'reject', value: 'CLI 未找到' };\n    });\n    act(() => {\n      result.current.sendMessage(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.error).toContain('CLI 未找到'));\n    expect(result.current.running).toBe(false);\n  });\n});\n"},"src/views/explores/hooks/use-explore-session.test.ts":{"tests":[{"id":"89","name":"useExploreSession：链还原与逐 run 事件重放（AC-9/AC-5） record 有既有链：挂载发起 agent_run_chain 恰一次（携 root 寻址 + 来源二元组）+ 逐 run 重放，events 按发起序拼接"},{"id":"90","name":"useExploreSession：链还原与逐 run 事件重放（AC-9/AC-5） record 为 null：不还原链（events 空态、loading 复位），send 为 no-op"},{"id":"91","name":"useExploreSession：链还原与逐 run 事件重放（AC-9/AC-5） agent_run_events 对中途 run reject：错误可见不崩（error 置位）"},{"id":"92","name":"useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7） 有链时 send：prompt 以 stance 前导开头、resume 为链尾 sessionId、三元组齐全"},{"id":"93","name":"useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7） 无链时 send（首条起链）：resume 与 parent 不传、来源三元组仍携带"},{"id":"94","name":"useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7） run 终态后：链增长、终态 record 回流复位，二次 send 的 resume 更新为新链尾 sessionId"},{"id":"95","name":"useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7） 链中某 run 无 session_id（异常终态）：send 不携带 resume 而非传空串"},{"id":"96","name":"useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7） 运行中重复 send：被抑制（running 门闩），不并发发起第二条 run"},{"id":"97","name":"useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7） send 成功后实时 Channel 事件信封（ipc: event）累积进 events"},{"id":"98","name":"useExploreSession → 基建接线：stop 透传 运行中 stop() → invoke(\"agent_stop\", { root, runId }) 复合键触达后端；Channel 仍可投递事件与终态 record"},{"id":"99","name":"useExploreSession：失败语义（AC-9） agent_start reject：error 置位、running 复位、既有事件不丢"},{"id":"100","name":"useExploreSession：加载在途态与守卫（AC-9） 链查询在途：chain / events 保持初始空态、loading 置位"},{"id":"101","name":"useExploreSession：加载在途态与守卫（AC-9） root 为 null：send 为 no-op（不发起 agent_start、running 不置位）"},{"id":"102","name":"useExploreSession：记录切换竞态（取消抑制，AC-9） 旧记录迟到的链 resolve 不覆盖新链"},{"id":"103","name":"useExploreSession：记录切换竞态（取消抑制，AC-9） 旧记录迟到的链 reject 不置错误、不污染新链"}],"source":"import { act, renderHook, waitFor } from '@testing-library/react';\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vite-plus/test';\n\nimport { buildExplorePrompt } from '../../../lib/explore-stance';\nimport type { AgentEvent, AgentRunRecord, ExploreRecord } from '../../../types/dto';\nimport { useExploreSession } from './use-explore-session';\n\n// ---------------------------------------------------------------------------\n// 进程边界 Mock：invoke 按命令名分发（agent_run_chain / agent_run_events /\n// agent_start 记录入参供断言、可切换 reject / pending；agent_stop 记录寻址）；\n// Channel mock 为可编程 class（捕获 onmessage，测试直接投递 AgentRunMessage\n// 信封——ipc: 'event' / 'record' 双变体——驱动实时流与终态回流）。\n// stance 前导不 mock：buildExplorePrompt 以真实实现参与 send 拼接语义断言。\n// ---------------------------------------------------------------------------\n\nconst { ChannelMock, invokeMock } = vi.hoisted(() => {\n  class ChannelMock {\n    onmessage: ((event: unknown) => void) | null = null;\n    static instances: ChannelMock[] = [];\n    constructor() {\n      ChannelMock.instances.push(this);\n    }\n  }\n  return { ChannelMock, invokeMock: vi.fn() };\n});\n\nvi.mock('@tauri-apps/api/core', () => ({ invoke: invokeMock, Channel: ChannelMock }));\n\n// ---------------------------------------------------------------------------\n// fixture（serde camelCase 线格式）\n// ---------------------------------------------------------------------------\n\nconst ROOT = 'C:\\\\demo\\\\alpha';\nconst RECORD_ID = 7;\n\nfunction exploreRecord(): ExploreRecord {\n  return {\n    id: RECORD_ID,\n    root: ROOT,\n    name: 'api-retry',\n    createdAt: 1727000000000,\n    updatedAt: 1727000000000,\n  };\n}\n\nfunction run(\n  id: number,\n  sessionId: string | null,\n  parentRunId: number | null,\n  status: AgentRunRecord['status'] = 'completed',\n): AgentRunRecord {\n  return {\n    id,\n    prompt: `explore 轮次 ${id}`,\n    cwd: ROOT,\n    env: 'default',\n    permissionMode: 'bypassPermissions',\n    status,\n    startedAt: 1727000000000 + id,\n    finishedAt: status === 'running' ? null : 1727000001000 + id,\n    numTurns: status === 'running' ? null : 1,\n    costUsd: status === 'running' ? null : 0.1,\n    durationMs: status === 'running' ? null : 500,\n    sessionId: status === 'running' ? null : sessionId,\n    error: null,\n    source: 'explore',\n    sourceRef: String(RECORD_ID),\n    parentRunId,\n  };\n}\n\nfunction textEvent(seq: number, text: string): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'message',\n    role: 'assistant',\n    blocks: [{ kind: 'text', text }],\n    parentToolUseId: null,\n  };\n}\n\nfunction runResultEvent(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'runResult',\n    subtype: 'success',\n    isError: false,\n    numTurns: 1,\n    durationMs: 500,\n    costUsd: 0.1,\n    usage: {},\n    sessionId: 's-tail',\n  };\n}\n\n/** Channel mock 实例形状（vi.hoisted 内 class 不外泄类型，取其结构）。 */\ninterface ChannelLike {\n  onmessage: ((event: unknown) => void) | null;\n}\n\nfunction lastChannel(): ChannelLike {\n  const instance = ChannelMock.instances.at(-1);\n  if (!instance) throw new Error('send 未创建 Channel');\n  return instance;\n}\n\n/** 投递实时事件信封（ipc: 'event'）。 */\nfunction deliverEvent(event: AgentEvent) {\n  act(() => {\n    lastChannel().onmessage?.({ ipc: 'event', event });\n  });\n}\n\n/** 投递终态记录信封（ipc: 'record'，后端闭流收尾）。 */\nfunction deliverRecord(record: AgentRunRecord) {\n  act(() => {\n    lastChannel().onmessage?.({ ipc: 'record', record });\n  });\n}\n\n/** 链 fixture：两条 parent_run_id 相连的 run（链头在前）。 */\nconst chainFixture = [run(11, 's-first', null), run(12, 's-tail', 11)];\n\nlet chainResult: AgentRunRecord[] | string;\nlet eventsByRun: Map<"+"number, AgentEvent[]> | string;\nlet startResult: AgentRunRecord | string | null;\n\nfunction mockIpc() {\n  ChannelMock.instances.length = 0;\n  chainResult = chainFixture.map((item) => ({ ...item }));\n  eventsByRun = new Map<"+"number, AgentEvent[]>([\n    [11, [textEvent(0, '首轮结论')]],\n    [12, [textEvent(0, '续轮结论'), runResultEvent(1)]],\n  ]);\n  // 提前 resolve 契约：agent_start 返回 running 记录（currentRunId 随 onRecord 确立）\n  startResult = run(13, 's-new-tail', 12, 'running');\n  invokeMock.mockImplementation((command: string, params?: Record<"+"string, unknown>) => {\n    if (command === 'agent_run_chain') {\n      expect(params).toMatchObject({\n        root: ROOT,\n        source: 'explore',\n        sourceRef: String(RECORD_ID),\n      });\n      return typeof chainResult === 'string'\n        ? Promise.reject(chainResult)\n        : Promise.resolve(chainResult);\n    }\n    if (command === 'agent_run_events') {\n      if (typeof eventsByRun === 'string') {\n        return Promise.reject(eventsByRun);\n      }\n      const runId = Number(params?.runId);\n      return Promise.resolve(eventsByRun.get(runId) ?? []);\n    }\n    if (command === 'agent_start') {\n      return typeof startResult === 'string'\n        ? Promise.reject(startResult)\n        : Promise.resolve(startResult);\n    }\n    return Promise.resolve(null);\n  });\n}\n\nbeforeEach(() => {\n  invokeMock.mockReset();\n  mockIpc();\n});\n\nafterEach(() => {\n  vi.useRealTimers();\n});\n\nasync function mounted(record: ExploreRecord | null = exploreRecord()) {\n  const rendered = renderHook(\n    (props: { record: ExploreRecord | null }) => useExploreSession(ROOT, props.record),\n    { initialProps: { record } },\n  );\n  await act(async () => {});\n  return rendered;\n}\n\nfunction startCallArgs(): Record<"+"string, unknown> {\n  const calls = invokeMock.mock.calls.filter(([name]) => name === 'agent_start');\n  const call = calls.at(-1);\n  if (!call) throw new Error('agent_start 未被调用');\n  return call[1] as Record<"+"string, unknown>;\n}\n\nconst SEND_INPUT = {\n  prompt: '继续追这条线索',\n  permissionMode: 'bypassPermissions' as const,\n};\n\ndescribe('useExploreSession：链还原与逐 run 事件重放（AC-9/AC-5）', () => {\n  it('record 有既有链：挂载发起 agent_run_chain 恰一次（携 root 寻址 + 来源二元组）+ 逐 run 重放，events 按发起序拼接', async () => {\n    const { result } = await mounted();\n\n    expect(result.current.loading).toBe(false);\n    const chainCalls = invokeMock.mock.calls.filter(([name]) => name === 'agent_run_chain');\n    expect(chainCalls).toHaveLength(1);\n    expect(chainCalls[0]).toEqual([\n      'agent_run_chain',\n      { root: ROOT, source: 'explore', sourceRef: String(RECORD_ID) },\n    ]);\n    expect(result.current.chain).toEqual(chainFixture);\n    expect(result.current.events).toEqual([\n      textEvent(0, '首轮结论'),\n      textEvent(0, '续轮结论'),\n      runResultEvent(1),\n    ]);\n    expect(result.current.error).toBeNull();\n  });\n\n  it('record 为 null：不还原链（events 空态、loading 复位），send 为 no-op', async () => {\n    const { result } = await mounted(null);\n\n    expect(invokeMock).not.toHaveBeenCalled();\n    expect(result.current.chain).toEqual([]);\n    expect(result.current.events).toEqual([]);\n    expect(result.current.loading).toBe(false);\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n    expect(invokeMock).not.toHaveBeenCalled();\n    expect(result.current.running).toBe(false);\n  });\n\n  it('agent_run_events 对中途 run reject：错误可见不崩（error 置位）', async () => {\n    eventsByRun = '事件查询失败';\n\n    const { result } = await mounted();\n    await waitFor(() => expect(result.current.error).toContain('事件查询失败'));\n\n    expect(result.current.loading).toBe(false);\n  });\n});\n\ndescribe('useExploreSession：send 拼接 stance 与链尾 resume（AC-9，D4/D7）', () => {\n  it('有链时 send：prompt 以 stance 前导开头、resume 为链尾 sessionId、三元组齐全', async () => {\n    const { result } = await mounted();\n    expect(result.current.chain).toHaveLength(2);\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    const prompt = String(args.prompt);\n    expect(prompt.startsWith(buildExplorePrompt('').slice(0, 40))).toBe(true);\n    expect(prompt.endsWith(SEND_INPUT.prompt)).toBe(true);\n    expect(args.resumeSessionId).toBe('s-tail');\n    expect(args.source).toBe('explore');\n    expect(args.sourceRef).toBe(String(RECORD_ID));\n    expect(args.parentRunId).toBe(12);\n    expect(args.root).toBe(ROOT);\n    expect(args.permissionMode).toBe('bypassPermissions');\n    expect(args.onEvent).toBeInstanceOf(ChannelMock);\n  });\n\n  it('无链时 send（首条起链）：resume 与 parent 不传、来源三元组仍携带', async () => {\n    chainResult = [];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    expect(args.resumeSessionId).toBeNull();\n    expect(args.parentRunId).toBeNull();\n    expect(args.source).toBe('explore');\n    expect(args.sourceRef).toBe(String(RECORD_ID));\n  });\n\n  it('run 终态后：链增长、终态 record 回流复位，二次 send 的 resume 更新为新链尾 sessionId', async () => {\n    const { result } = await mounted();\n    expect(result.current.chain).toHaveLength(2);\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n    // 提前 resolve：running 记录入链（id 立即可用）\n    expect(result.current.chain).toHaveLength(3);\n    expect(result.current.chain[2]).toEqual(run(13, 's-new-tail', 12, 'running'));\n\n    // 终态 record 经 Channel 信封回流（后端闭流收尾）：链尾推进为终态行\n    deliverRecord(run(13, 's-new-tail', 12));\n    await waitFor(() => expect(result.current.running).toBe(false));\n    expect(result.current.chain[2]).toEqual(run(13, 's-new-tail', 12));\n\n    act(() => {\n      result.current.send({ ...SEND_INPUT, prompt: '再来一轮' });\n    });\n    await act(async () => {});\n\n    expect(invokeMock.mock.calls.filter(([name]) => name === 'agent_start')).toHaveLength(2);\n    expect(startCallArgs().resumeSessionId).toBe('s-new-tail');\n    expect(startCallArgs().parentRunId).toBe(13);\n  });\n\n  it('链中某 run 无 session_id（异常终态）：send 不携带 resume 而非传空串', async () => {\n    chainResult = [run(11, null, null)];\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    const args = startCallArgs();\n    expect(args.resumeSessionId).toBeNull();\n    expect(args.parentRunId).toBe(11);\n  });\n\n  it('运行中重复 send：被抑制（running 门闩），不并发发起第二条 run', async () => {\n    let resolveStart: ((value: AgentRunRecord) => void) | null = null;\n    startResult = null;\n    invokeMock.mockImplementation((command: string) => {\n      if (command === 'agent_start') {\n        return new Promise<"+"AgentRunRecord>((resolve) => {\n          resolveStart = resolve;\n        });\n      }\n      if (command === 'agent_run_chain') {\n        return Promise.resolve(chainFixture);\n      }\n      if (command === 'agent_run_events') {\n        return Promise.resolve([]);\n      }\n      return Promise.resolve(null);\n    });\n\n    const { result } = await mounted();\n    expect(result.current.chain).toHaveLength(2);\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n    expect(invokeMock.mock.calls.filter(([name]) => name === 'agent_start')).toHaveLength(1);\n\n    // 启动 resolve（early resolve running）+ 终态 record 信封回流 → running 复位\n    act(() => {\n      resolveStart?.(run(13, 's-new-tail', 12, 'running'));\n    });\n    await act(async () => {});\n    deliverRecord(run(13, 's-new-tail', 12, 'stopped'));\n    await waitFor(() => expect(result.current.running).toBe(false));\n    expect(invokeMock.mock.calls.filter(([name]) => name === 'agent_start')).toHaveLength(1);\n  });\n\n  it('send 成功后实时 Channel 事件信封（ipc: event）累积进 events', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n    deliverEvent(textEvent(0, '实时片段'));\n    await act(async () => {});\n\n    expect(result.current.events).toContainEqual(textEvent(0, '实时片段'));\n  });\n});\n\n// ---------------------------------------------------------------------------\n// stop 透传（停止时序：前端 → invoke(\"agent_stop\") → 后端闭流收尾，\n// 前端流 MUST NOT 截断——终态 record 部件经 Channel 回流后 running 复位）。\n// ---------------------------------------------------------------------------\n\ndescribe('useExploreSession → 基建接线：stop 透传', () => {\n  it('运行中 stop() → invoke(\"agent_stop\", { root, runId }) 复合键触达后端；Channel 仍可投递事件与终态 record', async () => {\n    const { result } = await mounted();\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await waitFor(() => expect(result.current.running).toBe(true));\n\n    act(() => {\n      result.current.stop();\n    });\n    await act(async () => {});\n    expect(invokeMock).toHaveBeenCalledWith('agent_stop', { root: ROOT, runId: 13 });\n\n    // 前端流不截断：stop 后事件信封照常入镜像\n    deliverEvent(textEvent(0, '停止前已产出'));\n    await act(async () => {});\n    expect(result.current.events).toContainEqual(textEvent(0, '停止前已产出'));\n\n    // 终态 record 回流：running 经 Record 复位\n    deliverRecord(run(13, 's-new-tail', 12, 'stopped'));\n    await waitFor(() => expect(result.current.running).toBe(false));\n    expect(result.current.chain.at(-1)?.status).toBe('stopped');\n  });\n});\n\ndescribe('useExploreSession：失败语义（AC-9）', () => {\n  it('agent_start reject：error 置位、running 复位、既有事件不丢', async () => {\n    const { result } = await mounted();\n    const eventsBefore = [...result.current.events];\n    expect(eventsBefore.length).toBeGreaterThan(0);\n\n    startResult = '启动失败';\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n\n    await waitFor(() => expect(result.current.running).toBe(false));\n    expect(result.current.error).toContain('启动失败');\n    expect(result.current.events).toEqual(eventsBefore);\n    expect(result.current.chain).toEqual(chainFixture);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 强化断言（变异补杀）：加载在途态、root 守卫、记录切换竞态（取消抑制）。\n// ---------------------------------------------------------------------------\n\ndescribe('useExploreSession：加载在途态与守卫（AC-9）', () => {\n  it('链查询在途：chain / events 保持初始空态、loading 置位', async () => {\n    invokeMock.mockImplementation((command: string) => {\n      if (command === 'agent_run_chain') return new Promise<"+"AgentRunRecord[]>(() => {});\n      return Promise.resolve([]);\n    });\n\n    const { result } = renderHook(\n      (props: { record: ExploreRecord | null }) => useExploreSession(ROOT, props.record),\n      { initialProps: { record: exploreRecord() } },\n    );\n    await act(async () => {});\n\n    expect(result.current.loading).toBe(true);\n    expect(result.current.chain).toEqual([]);\n    expect(result.current.events).toEqual([]);\n    expect(result.current.error).toBeNull();\n  });\n\n  it('root 为 null：send 为 no-op（不发起 agent_start、running 不置位）', async () => {\n    const { result } = renderHook(\n      (props: { record: ExploreRecord | null }) => useExploreSession(null, props.record),\n      { initialProps: { record: exploreRecord() } },\n    );\n    await act(async () => {});\n\n    act(() => {\n      result.current.send(SEND_INPUT);\n    });\n    await act(async () => {});\n\n    expect(invokeMock).not.toHaveBeenCalled();\n    expect(result.current.running).toBe(false);\n  });\n});\n\ndescribe('useExploreSession：记录切换竞态（取消抑制，AC-9）', () => {\n  const recordB: ExploreRecord = { ...exploreRecord(), id: 8, name: 'other-topic' };\n  const chainB = [run(21, 's-b', null)];\n\n  it('旧记录迟到的链 resolve 不覆盖新链', async () => {\n    let resolveA: (value: AgentRunRecord[]) => void = () => {};\n    invokeMock.mockImplementation((command: string, params?: Record<"+"string, unknown>) => {\n      if (command === 'agent_run_chain') {\n        if (params?.sourceRef === '7') {\n          return new Promise<"+"AgentRunRecord[]>((resolve) => {\n            resolveA = resolve;\n          });\n        }\n        return Promise.resolve(chainB);\n      }\n      if (command === 'agent_run_events') return Promise.resolve([]);\n      return Promise.resolve(null);\n    });\n\n    const { result, rerender } = renderHook(\n      (props: { record: ExploreRecord | null }) => useExploreSession(ROOT, props.record),\n      { initialProps: { record: exploreRecord() } },\n    );\n    await act(async () => {});\n\n    rerender({ record: recordB });\n    await act(async () => {});\n    expect(result.current.chain).toEqual(chainB);\n\n    await act(async () => {\n      resolveA(chainFixture);\n    });\n    expect(result.current.chain).toEqual(chainB);\n  });\n\n  it('旧记录迟到的链 reject 不置错误、不污染新链', async () => {\n    let rejectA: (err: unknown) => void = () => {};\n    invokeMock.mockImplementation((command: string, params?: Record<"+"string, unknown>) => {\n      if (command === 'agent_run_chain') {\n        if (params?.sourceRef === '7') {\n          return new Promise<"+"AgentRunRecord[]>((_resolve, reject) => {\n            rejectA = reject;\n          });\n        }\n        return Promise.resolve(chainB);\n      }\n      if (command === 'agent_run_events') return Promise.resolve([]);\n      return Promise.resolve(null);\n    });\n\n    const { result, rerender } = renderHook(\n      (props: { record: ExploreRecord | null }) => useExploreSession(ROOT, props.record),\n      { initialProps: { record: exploreRecord() } },\n    );\n    await act(async () => {});\n\n    rerender({ record: recordB });\n    await act(async () => {});\n\n    await act(async () => {\n      rejectA(new Error('迟到的链失败'));\n    });\n    expect(result.current.error).toBeNull();\n    expect(result.current.chain).toEqual(chainB);\n  });\n});\n"},"src/views/agent/components/agent-run-form.test.tsx":{"tests":[{"id":"104","name":"AgentRunForm：参数面默认值与 prompt 必填（AC-5） 初始 permission-mode=bypassPermissions（默认档断言）"},{"id":"105","name":"AgentRunForm：参数面默认值与 prompt 必填（AC-5） prompt 为空串时启动按钮禁用；输入任意非空后启用"},{"id":"106","name":"AgentRunForm：onStart 回调与档位切换 填写后点击启动 → onStart 以 { prompt, permissionMode, engine } 恰调用一次（初始 engine=sdk）"},{"id":"107","name":"AgentRunForm：onStart 回调与档位切换 permission-mode 三档下拉含 default / acceptEdits / bypassPermissions 且均可选回填"},{"id":"108","name":"AgentRunForm：引擎二值下拉（调试页引擎选择，初始 sdk 与后端默认一致） 初始 agent-engine 下拉值为 sdk（对齐 permission-mode 默认档断言形态，与后端 DEFAULT_ENGINE 一致）"},{"id":"109","name":"AgentRunForm：引擎二值下拉（调试页引擎选择，初始 sdk 与后端默认一致） 切至 cli 后启动 → onStart 以 { prompt, permissionMode, engine: \"cli\" } 恰调用一次"},{"id":"110","name":"AgentRunForm：引擎二值下拉（调试页引擎选择，初始 sdk 与后端默认一致） 注入清单外 option 值（yolo）→ 不回填不触发 onChange，onStart 不携带非法 engine"},{"id":"111","name":"AgentRunForm：禁用与输入保真（边界） disabled=true 时启动入口禁用且点击不触发 onStart"},{"id":"112","name":"AgentRunForm：禁用与输入保真（边界） prompt 含换行 / emoji / 超长（>1000 字符）时 onStart 原样上抛"},{"id":"113","name":"AgentRunForm：禁用与输入保真（边界） 无 cwd 输入、无 model 选择（AC-6 缺席断言，D9：cwd 由 invoke 隐含传 root）"}],"source":"import { fireEvent, render, screen } from '@testing-library/react';\nimport { describe, expect, it, vi } from 'vite-plus/test';\n\nimport type { AgentPermissionMode } from '../../../types/dto';\nimport { AgentRunForm } from './agent-run-form';\n\n// AgentRunForm 为纯回调组件（onStart 以 vi.fn() 注入），无进程边界，不需要 Mock。\n// AgentStartInput 形状由 onStart 入参类型承载（'./agent-run-form' 同源导出）。\n\ntype AgentStartInput = Parameters<"+"React.ComponentProps<"+"typeof AgentRunForm>['onStart']>[0];\n\nfunction mount(disabled = false) {\n  const onStart = vi.fn();\n  render(<"+"AgentRunForm disabled={disabled} onStart={onStart} />);\n  return { onStart };\n}\n\nfunction typePrompt(value: string) {\n  fireEvent.change(screen.getByTestId('agent-prompt'), { target: { value } });\n}\n\nfunction startButton(): HTMLButtonElement {\n  return screen.getByTestId('agent-start');\n}\n\nfunction selectOf(testId: string): HTMLSelectElement {\n  return screen.getByTestId(testId);\n}\n\ndescribe('AgentRunForm：参数面默认值与 prompt 必填（AC-5）', () => {\n  it('初始 permission-mode=bypassPermissions（默认档断言）', () => {\n    mount();\n\n    expect(selectOf('agent-permission-mode').value).toBe('bypassPermissions');\n    // bare 认证前提提示初始不在场\n    expect(screen.queryByTestId('bare-auth-note')).toBeNull();\n  });\n\n  it('prompt 为空串时启动按钮禁用；输入任意非空后启用', () => {\n    mount();\n\n    expect(startButton().disabled).toBe(true);\n    // 纯空白仍视为空\n    typePrompt('   ');\n    expect(startButton().disabled).toBe(true);\n\n    typePrompt('你好');\n    expect(startButton().disabled).toBe(false);\n  });\n});\n\ndescribe('AgentRunForm：onStart 回调与档位切换', () => {\n  it('填写后点击启动 → onStart 以 { prompt, permissionMode, engine } 恰调用一次（初始 engine=sdk）', () => {\n    const { onStart } = mount();\n\n    typePrompt('帮我跑一轮');\n    fireEvent.click(startButton());\n\n    expect(onStart).toHaveBeenCalledTimes(1);\n    expect(onStart).toHaveBeenCalledWith({\n      prompt: '帮我跑一轮',\n      permissionMode: 'bypassPermissions',\n      engine: 'sdk',\n    } satisfies AgentStartInput);\n  });\n\n  it('permission-mode 三档下拉含 default / acceptEdits / bypassPermissions 且均可选回填', () => {\n    mount();\n\n    const select = selectOf('agent-permission-mode');\n    const values = Array.from(select.options).map((option) => option.value);\n    expect(values).toEqual(['bypassPermissions', 'acceptEdits', 'default']);\n\n    for (const value of values as AgentPermissionMode[]) {\n      fireEvent.change(select, { target: { value } });\n      expect(select.value).toBe(value);\n    }\n  });\n});\n\ndescribe('AgentRunForm：引擎二值下拉（调试页引擎选择，初始 sdk 与后端默认一致）', () => {\n  it('初始 agent-engine 下拉值为 sdk（对齐 permission-mode 默认档断言形态，与后端 DEFAULT_ENGINE 一致）', () => {\n    mount();\n\n    expect(selectOf('agent-engine').value).toBe('sdk');\n    // 可选面：cli / sdk 二值\n    const values = Array.from(selectOf('agent-engine').options).map((option) => option.value);\n    expect(values).toEqual(['cli', 'sdk']);\n  });\n\n  it('切至 cli 后启动 → onStart 以 { prompt, permissionMode, engine: \"cli\" } 恰调用一次', () => {\n    const { onStart } = mount();\n\n    fireEvent.change(selectOf('agent-engine'), { target: { value: 'cli' } });\n    expect(selectOf('agent-engine').value).toBe('cli');\n    typePrompt('显式 cli 调试轮');\n    fireEvent.click(startButton());\n\n    expect(onStart).toHaveBeenCalledTimes(1);\n    expect(onStart).toHaveBeenCalledWith({\n      prompt: '显式 cli 调试轮',\n      permissionMode: 'bypassPermissions',\n      engine: 'cli',\n    } satisfies AgentStartInput);\n  });\n\n  it('注入清单外 option 值（yolo）→ 不回填不触发 onChange，onStart 不携带非法 engine', () => {\n    const { onStart } = mount();\n\n    // ModeSelect 清单守卫：select 值被程序性改为清单外值时 onChange 不回填\n    // （fireEvent.change 携带 ENGINE_OPTIONS 之外的值，options.find 不命中）\n    fireEvent.change(selectOf('agent-engine'), { target: { value: 'yolo' } });\n    expect(selectOf('agent-engine').value).toBe('sdk');\n\n    typePrompt('清单外引擎轮');\n    fireEvent.click(startButton());\n    expect(onStart).toHaveBeenCalledWith({\n      prompt: '清单外引擎轮',\n      permissionMode: 'bypassPermissions',\n      engine: 'sdk',\n    } satisfies AgentStartInput);\n    expect(onStart.mock.calls[0]?.[0]).not.toHaveProperty('engine', 'yolo');\n  });\n});\n\ndescribe('AgentRunForm：禁用与输入保真（边界）', () => {\n  it('disabled=true 时启动入口禁用且点击不触发 onStart', () => {\n    const { onStart } = mount(true);\n\n    typePrompt('你好');\n    expect(startButton().disabled).toBe(true);\n    fireEvent.click(startButton());\n\n    expect(onStart).not.toHaveBeenCalled();\n  });\n\n  it('prompt 含换行 / emoji / 超长（>1000 字符）时 onStart 原样上抛', () => {\n    const { onStart } = mount();\n    const longPrompt = `多行 🎉\\n\"quoted\" ${'长'.repeat(1000)}`;\n\n    typePrompt(longPrompt);\n    fireEvent.click(startButton());\n\n    expect(onStart).toHaveBeenCalledWith({\n      prompt: longPrompt,\n      permissionMode: 'bypassPermissions',\n      engine: 'sdk',\n    } satisfies AgentStartInput);\n  });\n\n  it('无 cwd 输入、无 model 选择（AC-6 缺席断言，D9：cwd 由 invoke 隐含传 root）', () => {\n    mount();\n\n    expect(screen.queryByLabelText(/cwd/i)).toBeNull();\n    expect(screen.queryByLabelText(/model/i)).toBeNull();\n    expect(screen.queryByTestId('agent-cwd')).toBeNull();\n    expect(screen.queryByTestId('agent-model')).toBeNull();\n  });\n});\n"},"src/lib/agent-transport.test.ts":{"tests":[{"id":"114","name":"TauriAgentTransport：sendMessages body 链参数原样进入 agent_start 参数，transport 不增删改写任何字段"},{"id":"115","name":"TauriAgentTransport：sendMessages Channel 事件信封逐条经 eventToChunk 转 chunk 流出，顺序保序不重排"},{"id":"116","name":"TauriAgentTransport：sendMessages Record 信封 → data-run-record 部件 + finish 后可读流关闭，后续信封无 chunk"},{"id":"117","name":"TauriAgentTransport：构造观测点 注入 onEvent / onRecord 后逐条透传（含启动记录与终态 record）"},{"id":"118","name":"TauriAgentTransport：构造观测点 默认构造（无 options）不崩、不透传：信封投递与启动 resolve 均静默"},{"id":"119","name":"TauriAgentTransport：启动失败 agent_start reject → sendMessages 的流以错误 reject，不产出任何 chunk"},{"id":"120","name":"TauriAgentTransport：启动失败 非 Error 形态的 reject 原因包一层 Error 再透出（错误串保留）"},{"id":"121","name":"TauriAgentTransport：启动失败 缺少链参数（body 无 root/prompt/source）→ 参数校验先行拒绝，不发起 invoke"},{"id":"122","name":"TauriAgentTransport：启动失败 清单外 permissionMode → 参数校验拒绝并列出非法值"},{"id":"123","name":"TauriAgentTransport：engine 链参数 body.engine=\"sdk\" / \"cli\" → 读取透传至 invoke 第 9 位置参数"},{"id":"124","name":"TauriAgentTransport：engine 链参数 body 无 engine → engine=null 传递不抛错（缺席校验为 null，引擎全链可缺席）"},{"id":"125","name":"TauriAgentTransport：engine 链参数 body.engine 显式 null → engine=null 传递（与缺席同口径）"},{"id":"126","name":"TauriAgentTransport：engine 链参数 body.engine='yolo'（清单外值）→ 「非法 engine」参数校验拒绝且不发起 invoke（对齐 permissionMode 校验口径）"},{"id":"127","name":"TauriAgentTransport：边界 Channel 无 Event 直达 Record → 仅 record 部件 + finish 关流"},{"id":"128","name":"TauriAgentTransport：边界 ipc 判别值既非 event 也非 record 的消息被忽略，流不断开"},{"id":"129","name":"TauriAgentTransport：边界 reconnectToStream：任意 chatId 调用恒返回 null（重连由重放承担）"},{"id":"130","name":"TauriAgentTransport：生成绑定调用面 经生成绑定入口发起后 invoke 收到 \"agent_start\"，链参数 8 字段 camelCase key 与值逐字不变且 body 原样穿透"},{"id":"131","name":"TauriAgentTransport：生成绑定调用面 Channel<"+"AgentRunMessage> 信封（ipc event / record 双变体）类型来自生成物：事件转 chunk 保序、Record 收尾关流、未知信封忽略流不断"},{"id":"132","name":"TauriAgentTransport：生成绑定调用面 生成绑定错误通道（Result<"+"T, String> → reject）下启动失败：错误串透传、流以错误 reject、非 Error 原因包装行为不变"},{"id":"133","name":"TauriAgentTransport：生成绑定调用面 dto shim（from '../types/dto' 导入）在 shim 化后编译与运行不受影响：recordRow fixture 与断言照常工作"}],"source":"import { beforeEach, describe, expect, it, vi } from 'vite-plus/test';\n\nimport type { AgentEvent, AgentRunRecord } from '../types/dto';\nimport { eventToChunk, type AgentUIMessageChunk } from './agent-adapter';\nimport { TauriAgentTransport } from './agent-transport';\n\n// ---------------------------------------------------------------------------\n// 进程边界 Mock：invoke 按命令名分发（agent_start 可切换 resolve/reject 并记录\n// 入参）；Channel mock 为可编程 class（捕获 onmessage，测试直接投递\n// AgentRunMessage 信封驱动流）。ReadableStream 与 chunk 消费用真实实现。\n// ---------------------------------------------------------------------------\n\nconst { ChannelMock, invokeMock } = vi.hoisted(() => {\n  class ChannelMock {\n    onmessage: ((message: unknown) => void) | null = null;\n    static instances: ChannelMock[] = [];\n    constructor() {\n      ChannelMock.instances.push(this);\n    }\n  }\n  return { ChannelMock, invokeMock: vi.fn() };\n});\n\nvi.mock('@tauri-apps/api/core', () => ({ invoke: invokeMock, Channel: ChannelMock }));\n\n// ---------------------------------------------------------------------------\n// fixture\n// ---------------------------------------------------------------------------\n\nconst ROOT = 'C:\\\\demo\\\\alpha';\n\nfunction runStarted(seq: number): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'runStarted',\n    model: 'claude-opus',\n    sessionId: 's-1',\n    tools: ['Bash'],\n    mcpServers: [],\n  };\n}\n\nfunction textEvent(seq: number, text: string): AgentEvent {\n  return {\n    seq,\n    timestampMs: 1727000000000,\n    kind: 'message',\n    role: 'assistant',\n    blocks: [{ kind: 'text', text }],\n    parentToolUseId: null,\n  };\n}\n\nfunction recordRow(id: number, status: AgentRunRecord['status']): AgentRunRecord {\n  return {\n    id,\n    prompt: '调试一轮',\n    cwd: ROOT,\n    env: 'default',\n    permissionMode: 'bypassPermissions',\n    status,\n    startedAt: 1727000000000,\n    finishedAt: status === 'running' ? null : 1727000001000,\n    numTurns: null,\n    costUsd: null,\n    durationMs: null,\n    sessionId: null,\n    error: null,\n    source: 'debug',\n    sourceRef: null,\n    parentRunId: null,\n  };\n}\n\nconst CHAIN_BODY = {\n  root: ROOT,\n  prompt: '帮我跑一轮 loop',\n  permissionMode: 'bypassPermissions' as const,\n  resumeSessionId: 's-tail',\n  parentRunId: 12,\n  source: 'explore',\n  sourceRef: '7',\n};\n\n/** Channel mock 实例形状（vi.hoisted 内 class 不外泄类型，取其结构）。 */\ninterface ChannelLike {\n  onmessage: ((message: unknown) => void) | null;\n}\n\nfunction lastChannel(): ChannelLike {\n  const instance = ChannelMock.instances.at(-1);\n  if (!instance) throw new Error('sendMessages 未创建 Channel');\n  return instance;\n}\n\n/** 从 transport 读流并收集全部 chunk（流 error 则 promise reject）。 */\nasync function drain(stream: ReadableStream<"+"AgentUIMessageChunk>): Promise<"+"AgentUIMessageChunk[]> {\n  const reader = stream.getReader();\n  const collected: AgentUIMessageChunk[] = [];\n  for (;;) {\n    const next = await reader.read();\n    if (next.done) break;\n    collected.push(next.value);\n  }\n  return collected;\n}\n\nfunction send(transport: TauriAgentTransport, body: object = CHAIN_BODY) {\n  return transport.sendMessages({\n    trigger: 'submit-message',\n    chatId: 'chat-1',\n    messageId: undefined,\n    messages: [],\n    abortSignal: undefined,\n    body,\n  });\n}\n\nfunction startCallArgs(): Record<"+"string, unknown> {\n  const call = invokeMock.mock.calls.filter(([name]) => name === 'agent_start').at(-1);\n  if (!call) throw new Error('agent_start 未被调用');\n  return call[1] as Record<"+"string, unknown>;\n}\n\nbeforeEach(() => {\n  invokeMock.mockReset();\n  ChannelMock.instances.length = 0;\n});\n\n// ---------------------------------------------------------------------------\n// sendMessages：body 穿透与事件转 chunk\n// ---------------------------------------------------------------------------\n\ndescribe('TauriAgentTransport：sendMessages', () => {\n  it('body 链参数原样进入 agent_start 参数，transport 不增删改写任何字段', async () => {\n    invokeMock.mockResolvedValue(recordRow(13, 'running'));\n    const transport = new TauriAgentTransport();\n\n    const stream = await send(transport);\n    void stream.cancel();\n\n    const args = startCallArgs();\n    // engine 键恒在（body 无 engine → 缺席值 null 传递）\n    expect(args).toEqual({ ...CHAIN_BODY, engine: null, onEvent: expect.any(ChannelMock) });\n    expect(args['root']).toBe(CHAIN_BODY.root);\n    expect(args['prompt']).toBe(CHAIN_BODY.prompt);\n    expect(args['permissionMode']).toBe('bypassPermissions');\n    expect(args['resumeSessionId']).toBe('s-tail');\n    expect(args['parentRunId']).toBe(12);\n    expect(args['source']).toBe('explore');\n    expect(args['sourceRef']).toBe('7');\n    expect(args['engine']).toBeNull();\n  });\n\n  it('Channel 事件信封逐条经 eventToChunk 转 chunk 流出，顺序保序不重排', async () => {\n    invokeMock.mockResolvedValue(r
