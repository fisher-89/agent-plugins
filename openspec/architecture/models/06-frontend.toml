# 06 · 前端（28 元素 / 64 关系）
# 元素 = 页壳 1 + 视图 9 + 视图内子域 3 + 共享组件文件 10 + 原语层 1，另有 4 个容器。
# 关系只取 import 证据，目标按「最具体已声明元素」归属；指向 hooks / lib / types 的 import 不建边。

[element."App.Frontend.Shell"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src/app.tsx", "./packages/desktop/src/routes.tsx", "./packages/desktop/src/main.tsx", "./packages/desktop/src/components/app-sidebar.tsx"]
summary = "页壳：入口、路由表与侧栏装配"

