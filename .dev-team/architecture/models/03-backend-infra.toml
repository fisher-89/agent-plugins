# 03 · infra 适配层（8 元素 / 24 关系）
# 外部系统适配器，依赖方向为 infra → core（唯一跨域边 store → core.workflow 与生产依赖一致）。

[element."App.Backend.Infra"]
kind = "domain"
gate = "off"
summary = "外部系统适配层：进程、本地库、版本控制、文件监视与 agent 运行时"

[element."App.Backend.Infra.AgentRuntime"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/agent/"]
summary = "rig 驱动的 agent 会话运行时与工具沙箱"

[element."App.Backend.Infra.ArchiRuntime"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/archi/"]
summary = "架构漂移门禁执行体：取输入、调判定、落报告与派生结论"

[element."App.Backend.Infra.ChecksRuntime"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/checks/"]
summary = "测试命令执行与报告落盘的适配器"

[element."App.Backend.Infra.Exec"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/exec/"]
summary = "子进程执行边界：argv 直传与输出流"

[element."App.Backend.Infra.Store"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/store/"]
summary = "native_db 本地库边界（按工作区分文件）"

[element."App.Backend.Infra.VcsRuntime"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/vcs/"]
summary = "git 操作适配：工作树、提交与 rebase"

[element."App.Backend.Infra.Watch"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/infra/watch/"]
summary = "文件系统变更监视（notify）适配器"

[[relation]]
from = "App.Backend.Infra.AgentRuntime"
to = "App.Backend.Core.Agent"
desc = "会话事件与运行状态的领域词表复用"

[[relation]]
from = "App.Backend.Infra.AgentRuntime"
to = "App.Backend.Core.Archi"
desc = "架构检索工具读取模型图与文档关联"

[[relation]]
from = "App.Backend.Infra.AgentRuntime"
to = "App.Backend.Core.Checks"
desc = "检查结论语义驱动报告类工具"

[[relation]]
from = "App.Backend.Infra.AgentRuntime"
to = "App.Backend.Core.Config"
