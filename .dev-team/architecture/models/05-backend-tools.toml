# 05 · 构建工具 crate（3 元素 / 3 关系）
# 唯一一条「工具 → 壳」的反向边：导出 bindings 必须以壳的包为依赖。

[element."App.Backend.Tools"]
kind = "domain"
gate = "off"
summary = "构建期工具 crate 容器"

[element."App.Backend.Tools.ExportBindings"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/tools/export-bindings/"]
summary = "把 IPC 类型导出为前端 TypeScript 绑定"

[element."App.Backend.Tools.ArchiApiGen"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src-tauri/crates/tools/archi-api-gen/"]
summary = "模块 API 契约的唯一写盘面：生成四类生成物并做零 diff 比对"

[[relation]]
from = "App.Backend.Tools.ExportBindings"
to = "App.Backend.Shell"
desc = "为导出命令面 bindings 而依赖壳包"

[[relation]]
from = "App.Backend.Tools.ArchiApiGen"
to = "App.Backend.Core.Archi"
desc = "契约解析、装配、判据与渲染复用判定域"

[[relation]]
from = "App.Backend.Tools.ArchiApiGen"
to = "App.Backend.Core.Foundation"
desc = "契约目录与生成物路径派生"
