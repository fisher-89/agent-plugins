# 01 · 两个包根（2 元素 / 0 关系）
# Backend / Desktop 是全部 FQN 的祖先，各持根路径，兜底未被更具体元素认领的文件。

[element."Backend"]
kind = "package"
gate = "off"
path = ["./packages/desktop/src-tauri/"]
summary = "Rust 后端分层：领域引擎、适配器、应用壳与构建工具"

[element."Desktop"]
kind = "package"
gate = "off"
path = ["./packages/desktop/src/"]
summary = "React 前端：页壳、视图与共享组件"
