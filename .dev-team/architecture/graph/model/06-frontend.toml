# 06 · 前端（32 元素 / 77 关系）
# 元素 = 页壳 1 + 视图 9 + 视图内子域 3 + 共享组件文件 13 + 原语层 1 + 目录模块 1 + 生成物中继 1，另有 3 个容器。
# 关系只取 import 证据，目标按「最具体已声明元素」归属；未被叶元素认领的文件归属包根 Desktop。

[element."Desktop.Shell"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src/app.tsx", "./packages/desktop/src/routes.tsx", "./packages/desktop/src/main.tsx", "./packages/desktop/src/components/app-sidebar.tsx", "./packages/desktop/src/components/notification-bell.tsx"]
summary = "页壳：入口、路由表与侧栏装配"

[element."Desktop.Views"]
kind = "composite"
gate = "off"
summary = "路由挂载的页面集合"

[element."Desktop.Views.AgentDebug"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src/views/agent/"]
summary = "agent 调试页：运行表单、历史与实况流"

[element."Desktop.Views.Agents"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src/views/agents/"]
summary = "agent 实例与供应商配置页"

[element."Desktop.Views.Architecture"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src/views/architecture/"]
summary = "架构页：文件树 / 元素树 / 契约三视图、画布与元素信息面板"

[element."Desktop.Views.Changes"]
kind = "module"
gate = "off"
path = ["./packages/desktop/src/views/changes/"]
summary = "变更页：列表、详情与编排容器"

