# 根包混合 workspace：本清单兼作 desktop-app 包（tauri-cli 要求 tauri.conf.json
# 所在目录的 Cargo.toml 含 [package]，虚拟 workspace 会使 tauri dev/build 报
# "No package info in the config file"）与 cargo workspace 根。
[package]
name = "desktop-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
# 生产构建经 tauri build 启用；勿移除
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
foundation = { workspace = true }
workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
store = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-devtools = "2.2.1"

[dev-dependencies]
tempfile = { workspace = true }
# 命令层测试以 MockRuntime 构造 State（不启动真实 runtime）；仅测试构建启用
tauri = { workspace = true, features = ["test"] }

# 根包是隐式成员，不得显式列入 members（重复列出会报错）
[workspace]
resolver = "2"
members = ["crates/core/foundation", "crates/core/workflow", "crates/infra/store"]

# workspace 级依赖版本收敛；core 与 infra 均禁 Tauri（Tauri 只属于 desktop-app 壳）
[workspace.dependencies]
dunce = "1"
foundation = { path = "crates/core/foundation" }
workflow = { path = "crates/core/workflow" }
redb = "=4.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
store = { path = "crates/infra/store" }
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
