# 根包混合 workspace：本清单兼作 dev-team 包（tauri-cli 要求 tauri.conf.json
# 所在目录的 Cargo.toml 含 [package]，虚拟 workspace 会使 tauri dev/build 报
# "No package info in the config file"）与 cargo workspace 根。
[package]
name = "dev-team"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
# 生产构建经 tauri build 启用；勿移除
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }
# 测试二进制清单注入（见 build.rs）：与 tauri-winres 传递依赖同版本，锁内已存在
embed-resource = "3"

[dependencies]
agent = { workspace = true }
agent-cli = { workspace = true }
foundation = { workspace = true }
watch = { workspace = true }
workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["function"] }
specta-typescript = { workspace = true }
store = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-devtools = "2.2.1"
tauri-specta = { workspace = true }
# 工作区代码统计（tokei library 直依赖）：`=` 精确 pin + default-features = false
# 剥离 cli feature（clap 4 / colored / env_logger / num-format 不入树，纯库消费）；
# 仅落 desktop-app 壳，MUST NOT 出现在任何 core / infra crate
tokei = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 编排/命令层测试以 #[tokio::test] 驱动（drive_agent_run 直驱 / start_agent_run
# 泛型缝 / agent_start 与 agent_stop 命令面）
tokio = { workspace = true, features = ["rt", "macros"] }
# 命令层测试以 MockRuntime 构造 State（不启动真实 runtime）；仅测试构建启用
tauri = { workspace = true, features = ["test"] }

# 根包是隐式成员，不得显式列入 members（重复列出会报错）
[workspace]
resolver = "2"
members = [
    "crates/core/agent",
    "crates/core/foundation",
    "crates/core/workflow",
    "crates/infra/agent",
    "crates/infra/store",
    "crates/infra/watch",
    "crates/tools/export-bindings",
]

# workspace 级依赖版本收敛；core 与 infra 均禁 Tauri（Tauri 只属于 dev-team 壳）
[workspace.dependencies]
agent = { path = "crates/core/agent" }
agent-cli = { path = "crates/infra/agent" }
dunce = "1"
foundation = { path = "crates/core/foundation" }
notify = "8"
watch = { path = "crates/infra/watch" }
workflow = { path = "crates/core/workflow" }
# native_model pin 必须与 native_db 内部依赖（=0.4.20）严格一致，避免双版本 trait 失配
native_db = "=0.8.2"
native_model = "=0.4.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# store 直依赖：workspace 库文件名哈希成分（SHA-256 截断 128-bit）；
# 锁内既有传递依赖，无新包入树
sha2 = "0.10"
# specta 三件套 `=` 精确 pin + lockstep（RC 间无 semver 兼容，升级事件驱动不追新）；
# specta-typescript 0.0.12 与 specta rc.25 配对（tauri-specta rc.25 内部依赖同一 pin）
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "time"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
store = { path = "crates/infra/store" }
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
# tokei 13 稳定线（2025-11 发布）：工作区遍历 / 语言识别 / 行计数唯一提供方，
# 纯库消费（default-features = false 剥离 cli 栈）
tokei = { version = "=13.0.0", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
# specta 特性：tauri 出线类型（含 ipc::Channel<T>）的 Type 远程 impl
tauri = { version = "2", features = ["specta"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
