# 根包混合 workspace：本清单兼作 dev-team 包（tauri-cli 要求 tauri.conf.json
# 所在目录的 Cargo.toml 含 [package]，虚拟 workspace 会使 tauri dev/build 报
# "No package info in the config file"）与 cargo workspace 根。
[package]
name = "dev-team"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
# 生产构建经 tauri build 启用；勿移除
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }
# 测试二进制清单注入（见 build.rs）：与 tauri-winres 传递依赖同版本，锁内已存在
embed-resource = "3"

[dependencies]
agent = { workspace = true }
agent-runtime = { workspace = true }
# 命令面薄包装：投影、诊断、diff 与待落盘产物全在 archi
archi = { workspace = true }
# 架构漂移门禁执行体：取输入 → 调 archi 判定 → 落 reports/archi 报告 → 派生
# outcome（组合根只做 runner 构造与注入，零判定）
archi-runtime = { workspace = true }
checks-runtime = { workspace = true }
config = { workspace = true }
exec = { workspace = true }
foundation = { workspace = true }
orchestration = { workspace = true }
watch = { workspace = true }
workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["function"] }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
specta-zod = { workspace = true }
store = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-devtools = "=2.2.2"
tauri-plugin-opener = { workspace = true }
tauri-specta = { workspace = true }
tokei = { workspace = true }
tokio = { workspace = true }
vcs-runtime = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
native_db = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tauri = { workspace = true, features = ["test"] }

[workspace]
resolver = "2"
members = [
    "crates/core/agent",
    "crates/core/archi",
    "crates/core/checks",
    "crates/core/config",
    "crates/core/foundation",
    "crates/core/orchestration",
    "crates/core/workflow",
    "crates/infra/agent",
    "crates/infra/archi",
    "crates/infra/checks",
    "crates/infra/exec",
    "crates/infra/store",
    "crates/infra/vcs",
    "crates/infra/watch",
    "crates/tools/export-bindings",
    "crates/tools/specta-zod-patched",
]

# workspace 级依赖版本收敛；core 与 infra 均禁 Tauri（Tauri 只属于 dev-team 壳）
[workspace.dependencies]
agent = { path = "crates/core/agent" }
agent-runtime = { path = "crates/infra/agent" }
archi = { path = "crates/core/archi" }
# 架构漂移门禁执行面（infra/archi）：只做「取输入 → 调 archi 判定 → 落
# reports/archi 报告 → 派生 outcome」；零 Tauri / 零 spawn / 零 vcs / 零 store
archi-runtime = { path = "crates/infra/archi" }
checks = { path = "crates/core/checks" }
checks-runtime = { path = "crates/infra/checks" }
config = { path = "crates/core/config" }
exec = { path = "crates/infra/exec" }
dunce = "1"
foundation = { path = "crates/core/foundation" }
glob = "0.3"
# TS / JS 扫描面的排除匹配（globset 方言，与 `glob` 的花括号展开是两套引擎；
# 锁内既有 0.4.x，本变更为 `archi` 提为直接依赖）
globset = "0.4"
ignore = "0.4"
futures = "0.3"
notify = "8"
orchestration = { path = "crates/core/orchestration" }
# TS / JS 解析面（oxc 家族**同版**收敛项：`archi` 只开 parser 所需面，不引
# semantic / codegen；`oxc_ast` / `oxc_span` / `oxc_syntax` 是 `oxc_parser` 的
# 伴随件——同为 0.146.0，声明为直接依赖零新增锁包）。版本钉定判据见
# `openspec/changes/archi-check-and-gate/design.md` 待决问题 1 与
# `crates/core/archi/tests/README.md`（rustc 1.95 可用面：0.147+ 要求 1.96+
# 工具链，0.146.0 恰为本工具链可用的最新同版家族）。`oxc_resolver` 独立版本线
# （11.x），取本工具链可用最新值。
oxc_allocator = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_parser = { version = "=0.146.0", default-features = false }
oxc_resolver = "=11.24.3"
oxc_span = "=0.146.0"
oxc_syntax = "=0.146.0"
petgraph = "0.8"
# Rust `use` 树的**行号**（`syn` / `proc-macro2` 的 fallback span 只在
# `span-locations` 特性下记录行列；锁内既有 1.x，零新增包）。特性在全 workspace
# 统一开启（feature unification），故收敛项单点声明。
proc-macro2 = { version = "1", features = ["span-locations"] }
# Rust 项解析（mod / use / #[path] / cfg 属性；锁内既有 2.0.119）
syn = { version = "2", features = ["full"] }
watch = { path = "crates/infra/watch" }
workflow = { path = "crates/core/workflow" }
native_db = "=0.8.2"
native_model = "=0.4.20"
regex = "1"
rig = { version = "=0.43.0", default-features = false, features = [
    "reqwest",
    "native-tls",
    "memory",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json", "time"] }
specta-serde = "=0.0.13"
specta-typescript = "=0.0.13"
specta-zod = { path = "crates/tools/specta-zod-patched" }
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
store = { path = "crates/infra/store" }
tempfile = "3"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
toml = "1"
toml_edit = "0.25"
tokei = { version = "=13.0.0", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
tauri = { version = "=2.12.5", features = ["specta", "devtools"] }
tauri-build = { version = "=2.7.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
vcs-runtime = { path = "crates/infra/vcs" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
