# 根包混合 workspace：本清单兼作 desktop-app 包（tauri-cli 要求 tauri.conf.json
# 所在目录的 Cargo.toml 含 [package]，虚拟 workspace 会使 tauri dev/build 报
# "No package info in the config file"）与 cargo workspace 根。
[package]
name = "desktop-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
# 生产构建经 tauri build 启用；勿移除
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
foundation = { workspace = true }
workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }

# 根包是隐式成员，不得显式列入 members（重复列出会报错）
[workspace]
resolver = "2"
members = ["crates/core/foundation", "crates/core/workflow"]

# workspace 级依赖版本收敛；core 两个 crate 禁用任何 Tauri 依赖
[workspace.dependencies]
foundation = { path = "crates/core/foundation" }
workflow = { path = "crates/core/workflow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
