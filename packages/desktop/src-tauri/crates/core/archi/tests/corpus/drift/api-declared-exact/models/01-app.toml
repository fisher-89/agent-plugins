# 名字级两桶语料（`relation-api-dependency-check`）：关系写了 `apis` 后，
# `used ∖ declared`（用了没声明 = 硬事实）与 `declared ∖ used`（声明没用 = 观察项）
# 按引入方档位分桶；本 case 形态为「声明与事实全匹配（两桶皆空）」。

[element."App"]
kind = "package"
gate = "off"
path = ["./src/"]

[element."App.Api"]
kind = "module"
gate = "strict"
path = ["./src/api/"]

[element."App.Consumer"]
kind = "module"
gate = "strict"
path = ["./src/consumer/"]

[[relation]]
from = "App.Consumer"
to = "App.Api"
apis = ["AgentInput", "SessionPanel"]
