[package]
name = "exec"
version = "0.1.0"
edition = "2021"

[dependencies]
# 报告目录树派生单点（artifact 相对路径 / exec 输出记录同锚）
foundation = { workspace = true }
# 统一执行体 run_shell 的特性面（逐项最小，不引 rt / rt-multi-thread / full——
# 设计不 tokio::spawn，future 只持局部可变借用，故无运行时需求）：
# - process：Command / Child / ChildStdout / ChildStderr / kill_on_drop；
# - io-util：AsyncReadExt::read_to_end（双管道排水）；
# - time：sleep（取消轮询）/ timeout（预算与杀后收尾上界）；
# - macros：select!（三臂竞速）/ join!（双管道并发排水）。
tokio = { workspace = true, features = ["process", "io-util", "time", "macros"] }

# Windows 目标的系统 API 绑定（平台条件依赖——非 Windows 目标零新增编译依赖；
# 依赖方向与分层零变，见 desktop-crate-layout「平台条件依赖的落位例外」）。
# 两个用途，各只开所需 feature：
# - 锁占用诊断的**占用者点名**（Restart Manager：RmStartSession /
#   RmRegisterResources / RmGetList / RmEndSession / RM_PROCESS_INFO）。精确探针
#   本身走 std `OpenOptionsExt` 的 `access_mode` / `share_mode`；
# - 进程树回收的**作业对象**（`job`：CreateJobObjectW / AssignProcessToJobObject
#   / TerminateJobObject / CloseHandle）——`taskkill /T` 按父子快照遍历，msys fork
#   副本可能漏杀并持管道写端把 tokio 阻塞线程池钉死，作业成员资格才不受父子
#   关系改写影响。不引 `Win32` 全量 / `Win32_Security` / `Win32_System_Threading`。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_RestartManager",
] }

[dev-dependencies]
tempfile = { workspace = true }
# 执行体用例：rt（#[tokio::test]）+ macros（select! 面）+ test-util
#（超时 / 取消用例的 start_paused + 手动 advance，沿 mutation/*_test.rs 先例）。
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
