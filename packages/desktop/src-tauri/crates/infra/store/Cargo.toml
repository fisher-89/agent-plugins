[package]
name = "store"
version = "0.1.0"
edition = "2021"

# db 边界基础设施：native_db / native_model 模型层 + dunce / serde 系依赖；
# 仅依赖 `agent` 纯类型作嵌装载荷（禁 agent 域行为）；禁 Tauri。
# redb 为迁移期专用直依赖（读旧 legacy 库），由后续变更收掉
[dependencies]
agent = { workspace = true }
dunce = { workspace = true }
native_db = { workspace = true }
native_model = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
