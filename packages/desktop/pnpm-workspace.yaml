# 扁平化 node_modules（npm 同款布局）：isolated 布局下 vite-plus 内部经
# import.meta.url（realpath）解析出的 `tsgolint.cmd` 落在
# `.pnpm/vite-plus@…/…/.bin` 深路径；该路径经 oxlint 的 `cmd.exe` 批处理中转
# 时超过 ~250 字符阈值（CreateProcess MAX_PATH 边界），`vp check` 以
# 「The system cannot find the path specified」失败。hoisted 布局把候选路径
# 收敛到 `node_modules/.bin`（约 150 字符），lint 类型检查恢复正常。
nodeLinker: hoisted
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.96'
  - ai@7.0.118
  - '@ai-sdk/react@4.0.121'
# 将 `vite` 别名到 vite-plus 的 rolldown 内核（vite-plus README 推荐的 override）：
# @vitejs/plugin-react 运行时检测 `rolldownVersion` 导出，命中后走 oxc 配置分支，
# 不再返回已废弃的 esbuild/optimizeDeps.esbuildOptions（vp check 的弃用警告来源）。
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
# 别名后 vite 版本号为 0.2.9,不满足 vitest/plugin-react 声明的 ^6||^7||^8
# semver 范围,但 vite-plus-core 即 rolldown-vite、API 兼容,放行该版本告警。
peerDependencyRules:
  allowedVersions:
    vite: '*'
